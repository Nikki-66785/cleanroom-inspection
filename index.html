<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="roxUVWcEMiFJzzet0ydx0x">
<head data-page-node-id="s9XPuFRFJhVnmQaYRg3pDD">
<meta charset="UTF-8" data-page-node-id="pQaIaRqONNwlxiNa3cIR2u">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" data-page-node-id="3xTAShH1AaUyfDoWcQWRmA">
<title>洁净车间巡检 · 车间巡检管理</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:#DFE6EA;display:flex;align-items:center;justify-content:center;
  color:#0F1E28;font-size:14px;-webkit-font-smoothing:antialiased;
}
:root{
  --pri:#0F8378;--pri-d:#0B6A61;--pri-l:#E6F3F1;
  --ink:#0F1E28;--ink2:#61748A;--ink3:#93A4B2;
  --line:#E9EFF3;--bg:#F3F6F8;--card:#fff;
  --red:#D33F3F;--red-l:#FCECEC;
  --amber:#BF7A12;--amber-l:#FDF4E4;
  --green:#12825A;--green-l:#E7F5EF;
  --blue:#2563C9;--blue-l:#EBF1FC;
}
.phone{
  position:relative;width:390px;height:844px;max-height:97vh;
  background:var(--bg);border-radius:40px;overflow:hidden;
  display:flex;flex-direction:column;
  box-shadow:0 0 0 9px #23323C,0 0 0 10px #3B4C57,0 28px 64px rgba(12,35,48,.28);
}
@media (max-width:820px),(max-height:700px){
  .phone{width:100%;height:100vh;max-height:none;border-radius:0;box-shadow:none}
  body{display:block;background:var(--bg)}
}
/* Pad 适配：平板（iPad 等）下放宽外壳与内容区，保持可读比例 */
@media (min-width:821px) and (max-width:1366px) and (min-height:701px){
  .phone{width:min(58vw,760px);height:min(94vh,1080px)}
  #view{padding:16px 24px 30px}
  .nav-in{padding:0 18px}
  .sheet-pan{max-width:640px}
}
#nav{flex:0 0 auto;background:#fff;border-bottom:1px solid var(--line)}
.nav-in{height:46px;display:flex;align-items:center;padding:0 10px;gap:6px}
.nav-title{font-size:16px;font-weight:650;flex:1;text-align:center;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-btn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  border-radius:9px;border:none;background:transparent;color:var(--ink);cursor:pointer;flex:0 0 32px}
.nav-btn:active{background:#EEF3F6}
#view{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 14px 24px}
#view::-webkit-scrollbar{width:0}
#tabbar{flex:0 0 auto;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:6px}
.tab{flex:1;border:none;background:transparent;padding:8px 0 4px;display:flex;flex-direction:column;
  align-items:center;gap:3px;font-size:10.5px;color:var(--ink3);font-weight:500;cursor:pointer;position:relative}
.tab.on{color:var(--pri);font-weight:650}
.tab svg{width:21px;height:21px}
.tab .dot{position:absolute;top:6px;right:50%;margin-right:-16px;min-width:15px;height:15px;
  border-radius:8px;background:var(--red);color:#fff;font-size:9px;font-weight:700;
  display:flex;align-items:center;justify-content:center;padding:0 4px}

.card{background:var(--card);border-radius:14px;padding:14px;border:1px solid var(--line);
  box-shadow:0 1px 2px rgba(15,40,55,.03)}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 9px}
.sec-title h3{margin:0;font-size:14px;font-weight:650}
.sec-title span{font-size:11.5px;color:var(--ink3)}
.tiny{font-size:11px;color:var(--ink3);line-height:1.6}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:600;
  padding:2px 6px;border-radius:5px;line-height:1.5;font-style:normal;white-space:nowrap}
.tag.ok{background:var(--green-l);color:var(--green)}
.tag.danger{background:var(--red-l);color:var(--red)}
.tag.warn{background:var(--amber-l);color:var(--amber)}
.tag.info{background:var(--blue-l);color:var(--blue)}
.tag.gray{background:#F0F4F6;color:var(--ink2)}
.tag.pri{background:var(--pri-l);color:var(--pri-d)}
.btn{border:none;border-radius:11px;font-size:14px;font-weight:600;padding:12px 16px;
  cursor:pointer;font-family:inherit;transition:transform .06s}
.btn:active{transform:scale(.985)}
.btn-pri{background:var(--pri);color:#fff;box-shadow:0 6px 16px rgba(15,131,120,.22)}
.btn-ghost{background:#EEF3F5;color:var(--ink)}
.btn-line{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn-sm{padding:8px 10px;font-size:12px;border-radius:9px}
.btn:disabled{opacity:.45;box-shadow:none}
.row{display:flex;align-items:center;gap:10px}
.empty{text-align:center;padding:40px 20px;color:var(--ink3)}
.empty b{display:block;font-size:13px;color:var(--ink2);margin-bottom:6px}
.empty svg{opacity:.45;margin-bottom:10px}

/* 角色胶囊 */
.role-pill{display:flex;align-items:center;gap:5px;border:1px solid var(--line);background:#F7FAFB;
  border-radius:999px;padding:5px 9px;font-size:11px;font-weight:700;cursor:pointer;flex:0 0 auto}
.role-pill i{width:6px;height:6px;border-radius:50%;display:block}
.r-ins i{background:#0F8378}.r-com i{background:#2563C9}.r-pro i{background:#C77A1E}.r-prev i{background:#6B7E8C}
.r-ins{color:#0B6A61;background:#EAF5F3;border-color:#D3E9E5}
.r-com{color:#1B4FA8;background:#EFF4FD;border-color:#D9E4F8}
.r-pro{color:#9A5E12;background:#FDF6EA;border-color:#F2E3C8}
.r-prev{color:#46586A;background:#F0F3F6;border-color:#E0E7ED}

/* hero */
.hero{border-radius:18px;padding:16px;border:1px solid #D9EAE6;
  background:linear-gradient(150deg,#E4F2EF 0%,#F0F8F6 58%,#F8FBFA 100%);position:relative;overflow:hidden}
.hero.com{border-color:#DCE6F7;background:linear-gradient(150deg,#E8F0FC 0%,#F2F6FD 60%,#FAFCFF 100%)}
.hero.pro{border-color:#F0E3CB;background:linear-gradient(150deg,#FCF3E3 0%,#FDF8EF 60%,#FFFCF7 100%)}
.hero::after{content:"";position:absolute;right:-42px;top:-56px;width:150px;height:150px;
  border-radius:50%;background:rgba(15,131,120,.05)}
.hero.com::after{background:rgba(37,99,201,.05)}
.hero.pro::after{background:rgba(199,122,30,.06)}
.hero-date{font-size:11.5px;color:#4C7A72;font-weight:600;letter-spacing:.4px}
.hero.com .hero-date{color:#4A6690}.hero.pro .hero-date{color:#8A6A3A}
.hero-h{font-size:19px;font-weight:700;margin:4px 0 3px;letter-spacing:-.2px}
.hero-sub{font-size:11.5px;color:#4C7A72}
.hero.com .hero-sub{color:#4A6690}.hero.pro .hero-sub{color:#8A6A3A}
.hero.prev{border-color:#E0E7ED;background:linear-gradient(150deg,#F0F3F6 0%,#F7F9FB 60%,#FDFEFE 100%)}
.hero.prev::after{background:rgba(107,126,140,.06)}
.hero.prev .hero-date,.hero.prev .hero-sub{color:#5A6B7A}
.ring{position:relative;width:78px;height:78px;flex:0 0 78px}
.ring svg{transform:rotate(-90deg)}
.ring-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;font-size:17px;font-weight:750;color:var(--pri-d);line-height:1}
.hero.com .ring-num{color:#1B4FA8}.hero.pro .ring-num{color:#9A5E12}
.ring-num small{font-size:9.5px;font-weight:600;color:#5E8981;margin-top:3px}
.hero-stats{display:flex;margin-top:14px;border-top:1px dashed #CFE3DE;padding-top:11px}
.hero.com .hero-stats{border-color:#D5E0F2}
.hero.pro .hero-stats{border-color:#EFE0C6}
.hs{flex:1;text-align:center;position:relative}
.hs+.hs::before{content:"";position:absolute;left:0;top:2px;bottom:2px;width:1px;background:#D9EAE6}
.hero.com .hs+.hs::before{background:#DCE6F7}
.hero.pro .hs+.hs::before{background:#EFE3CC}
.hs b{display:block;font-size:16px;font-weight:700;line-height:1.2}
.hs span{font-size:10.5px;color:#5E8981;font-weight:500}

/* 任务卡 */
.tcard{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px;
  margin-bottom:9px;cursor:pointer;position:relative;overflow:hidden}
.tcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#E4EBEF}
.tcard.st-pending::before{background:#C3CFD8}
.tcard.st-doing::before{background:var(--blue)}
.tcard.st-submitted::before{background:var(--amber)}
.tcard.st-processing::before{background:var(--pri)}
.tcard.st-closed::before{background:var(--green)}
.tc-h{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.tc-name{font-size:14px;font-weight:680;display:flex;align-items:center;gap:6px}
.tc-code{font-size:10px;font-weight:700;color:var(--ink3);background:#F2F5F7;
  padding:1px 5px;border-radius:4px}
.tc-meta{display:flex;gap:10px;font-size:11px;color:var(--ink3);margin-top:7px;flex-wrap:wrap;align-items:center}
.tc-bar{height:4px;border-radius:3px;background:#EDF1F4;margin-top:9px;overflow:hidden}
.tc-bar i{display:block;height:100%;border-radius:3px;background:var(--pri)}

/* 房间网格 */
.room-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.room-cell{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px;cursor:pointer;
  position:relative;transition:border-color .15s}
.room-cell:active{border-color:var(--pri)}
.room-cell.checked{border-color:#CFE5DF;background:#FBFEFD}
.rc-code{font-size:10px;font-weight:700;color:var(--pri);letter-spacing:.2px}
.room-cell.checked .rc-code{color:var(--pri-d)}
.rc-name{font-size:12.5px;font-weight:600;margin-top:3px;line-height:1.35}
.rc-st{font-size:10px;color:var(--ink3);margin-top:5px;display:flex;align-items:center;gap:4px}
.rc-st .pdot{width:5px;height:5px;border-radius:50%;background:#CBD5DD;display:block}
.room-cell.checked .rc-st .pdot{background:var(--green)}
.room-cell.hasfind .rc-st .pdot{background:var(--red)}
.rc-badge{position:absolute;top:8px;right:8px;min-width:16px;height:16px;border-radius:8px;
  background:var(--red);color:#fff;font-size:9.5px;font-weight:700;display:flex;align-items:center;
  justify-content:center;padding:0 4px}

/* 发现项卡 */
.fcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;
  margin-bottom:9px;cursor:pointer;position:relative}
.fcard.lv-critical{border-left:3px solid #D33F3F}
.fcard.lv-major{border-left:3px solid #E0A03A}
.fcard.lv-minor{border-left:3px solid #5B8DC9}
.fcard.lv-advice{border-left:3px solid #B9C6CF}
.fc-h{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.fc-t{font-size:13px;font-weight:650;line-height:1.45;flex:1}
.fc-loc{font-size:10.5px;color:var(--ink3);margin-top:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fc-foot{display:flex;justify-content:space-between;align-items:center;margin-top:9px;
  padding-top:9px;border-top:1px dashed #EDF1F4;font-size:10.5px;color:var(--ink3)}
.photos{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.photos img{width:56px;height:56px;object-fit:cover;border-radius:7px;border:1px solid var(--line)}

/* 详情 */
.dt-hero{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:10px}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed #EDF1F4;font-size:12.5px}
.kv:last-child{border-bottom:none}
.kv span:first-child{color:var(--ink2);flex:0 0 auto}
.kv span:last-child{font-weight:600;text-align:right}
.timeline{position:relative;padding-left:20px}
.tl{position:relative;padding-bottom:16px}
.tl:last-child{padding-bottom:0}
.tl::before{content:"";position:absolute;left:-14px;top:5px;width:7px;height:7px;border-radius:50%;
  background:#D6DFE6;border:2px solid #fff;box-shadow:0 0 0 1px #E1E9EE}
.tl.done::before{background:var(--pri);box-shadow:0 0 0 1px #B8DDD7}
.tl::after{content:"";position:absolute;left:-11px;top:14px;bottom:0;width:1px;background:#E8EEF2}
.tl:last-child::after{display:none}
.tl-t{font-size:12.5px;font-weight:650}
.tl-d{font-size:11px;color:var(--ink3);margin-top:3px;line-height:1.6}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi b{display:block;font-size:21px;font-weight:750;letter-spacing:-.5px;line-height:1.15}
.kpi span{font-size:10.5px;color:var(--ink3);font-weight:500}
.kpi i{font-style:normal;font-size:10px;font-weight:650;padding:1px 5px;border-radius:4px;margin-left:4px}
.bar-row{display:flex;align-items:center;gap:9px;margin-bottom:9px;font-size:11.5px}
.bar-row .bl{width:96px;flex:0 0 96px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;height:8px;background:#F0F4F6;border-radius:5px;overflow:hidden}
.bar-track i{display:block;height:100%;border-radius:5px;background:var(--pri)}
.bar-row .bv{width:18px;text-align:right;font-weight:700;font-size:11.5px;flex:0 0 18px}

/* 配置 */
.cfg-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;
  border-bottom:1px solid #F2F6F8}
.cfg-row:last-child{border-bottom:none}
.stepper{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.stepper button{width:30px;height:28px;border:none;background:#F7FAFB;font-size:15px;font-weight:600;
  color:var(--ink2);cursor:pointer;font-family:inherit}
.stepper button:active{background:#EDF2F5}
.stepper span{width:44px;text-align:center;font-size:12.5px;font-weight:700}
.ws-item{border:1px solid var(--line);border-radius:11px;margin-bottom:8px;overflow:hidden;background:#fff}
.ws-h{display:flex;align-items:center;justify-content:space-between;padding:12px;cursor:pointer;gap:8px}
.ws-name{font-size:13px;font-weight:650}
.ws-rooms{padding:0 12px 10px;display:none}
.ws-item.open .ws-rooms{display:block}
.ws-room{display:flex;align-items:center;justify-content:space-between;padding:8px 0;
  border-top:1px dashed #EDF1F4;font-size:12px}
.ws-room .rc{font-size:10px;font-weight:700;color:var(--ink3);background:#F2F5F7;
  padding:1px 5px;border-radius:4px;margin-right:6px}

/* actionbar */
.actionbar{position:absolute;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);
  backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 14px 16px;
  display:flex;gap:9px;z-index:20}
.actionbar .btn{flex:1}
.has-bar #view{padding-bottom:86px}

/* sheet */
#sheet{position:absolute;inset:0;z-index:60;display:none}
#sheet.on{display:block}
.sheet-mask{position:absolute;inset:0;background:rgba(11,30,40,.42)}
.sheet-pan{position:absolute;left:0;right:0;bottom:0;max-height:90%;background:#F5F8FA;
  border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .24s ease}
@keyframes up{from{transform:translateY(28px);opacity:.65}to{transform:translateY(0);opacity:1}}
.sheet-hd{padding:14px 16px 10px;border-bottom:1px solid var(--line);background:#fff;
  border-radius:20px 20px 0 0;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sheet-hd b{font-size:15px}
.sheet-bd{flex:1;overflow-y:auto;padding:12px 14px 16px}
.sheet-ft{padding:10px 14px 16px;background:#fff;border-top:1px solid var(--line);display:flex;gap:9px}
.sheet-ft .btn{flex:1}
.fld{margin-top:11px}
.fld:first-child{margin-top:0}
.fld label{display:block;font-size:10.5px;font-weight:650;color:var(--ink3);margin-bottom:5px;letter-spacing:.3px}
.fld input,.fld textarea,.fld select{width:100%;border:1px solid #E1E9EE;border-radius:9px;
  padding:10px 11px;font-size:13px;font-family:inherit;color:var(--ink);background:#FAFCFD;outline:none;
  transition:border-color .15s}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--pri);background:#fff}
.fld textarea{resize:none;line-height:1.6}
/* 语音输入 */
.fld-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.fld-hd label{margin-bottom:0}
.mic{display:inline-flex;align-items:center;gap:4px;border:1px solid #D7E4E2;background:#F5FBF9;
  color:#0B6A61;border-radius:12px;padding:3px 9px 3px 7px;font-size:10.5px;font-weight:650;
  cursor:pointer;font-family:inherit;transition:all .15s;line-height:1.4}
.mic:hover{background:#EAF5F3}
.mic svg{flex:0 0 11px}
.mic.rec{background:#D33F3F;border-color:#D33F3F;color:#fff;animation:pulse 1.1s infinite}
.mic.rec:hover{background:#C13636}
.mic:disabled{opacity:.45;cursor:not-allowed}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(211,63,63,.45)}50%{box-shadow:0 0 0 5px rgba(211,63,63,0)}}
.voice-tip{font-size:10.5px;color:#0B6A61;background:#F0F9F7;border:1px solid #D7E9E5;
  border-radius:8px;padding:7px 9px;margin-top:7px;line-height:1.55;display:none}
.voice-tip.on{display:block}
.up{width:56px;height:56px;border:1.5px dashed #C9D7DF;border-radius:9px;display:flex;align-items:center;
  justify-content:center;background:#FAFCFD;cursor:pointer;color:var(--ink3);position:relative;overflow:hidden}
.up img{width:100%;height:100%;object-fit:cover}
.up-wrap{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.lv-pick{display:flex;gap:7px}
.lv-pick button{flex:1;border:1.5px solid #E1E9EE;background:#FAFCFD;border-radius:10px;padding:9px 4px;
  font-family:inherit;cursor:pointer;text-align:center;transition:all .14s}
.lv-pick button b{display:block;font-size:12px;font-weight:700;color:var(--ink2)}
.lv-pick button small{display:block;font-size:9.5px;color:var(--ink3);margin-top:2px}
.lv-pick button[data-lv="critical"].on{background:#FCECEC;border-color:#E9B9B9}
.lv-pick button[data-lv="critical"].on b{color:var(--red)}
.lv-pick button[data-lv="major"].on{background:#FDF4E4;border-color:#EBD3A5}
.lv-pick button[data-lv="major"].on b{color:var(--amber)}
.lv-pick button[data-lv="minor"].on{background:#F0F4F6;border-color:#CFDAE2}
.lv-pick button[data-lv="minor"].on b{color:var(--ink2)}
.role-opt{display:flex;align-items:center;gap:11px;padding:13px 12px;border:1.5px solid var(--line);
  border-radius:12px;margin-bottom:8px;background:#fff;cursor:pointer}
.role-opt.on{border-color:var(--pri);background:#F7FCFB}
.role-opt .rc-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;font-size:15px;flex:0 0 36px}
.role-opt b{font-size:13px;display:block}
.role-opt small{font-size:10.5px;color:var(--ink3);display:block;margin-top:2px;line-height:1.5}

#toast{position:absolute;left:50%;bottom:110px;transform:translate(-50%,10px);z-index:80;
  background:rgba(16,32,42,.9);color:#fff;font-size:12.5px;font-weight:600;padding:10px 16px;
  border-radius:10px;opacity:0;pointer-events:none;transition:all .22s;max-width:82%;text-align:center;
  line-height:1.5}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* 登录门禁 */
#login{position:absolute;inset:0;z-index:120;display:none}
#login:has(.login-mask){display:block}
.login-mask{position:absolute;inset:0;background:linear-gradient(160deg,#0F8378 0%,#0B6A61 42%,#F3F6F8 42%,#F3F6F8 100%);
  display:flex;align-items:center;justify-content:center;padding:20px 18px}
.login-card{width:100%;max-width:340px;background:#fff;border-radius:18px;padding:22px 20px 18px;
  box-shadow:0 18px 44px rgba(10,40,36,.22)}
.login-logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#0F8378,#18A795);
  color:#fff;font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto}
.login-title{font-size:16px;font-weight:700;text-align:center;margin-top:11px}
.login-sub{font-size:11px;color:var(--ink3);text-align:center;margin-top:5px;line-height:1.6}

/* ============================================================
   洁净车间巡检管理系统（多角色）
   巡检人登记发现项 → 合规管理确认 → 整改回复人 7 日内回复并给出责任人
   ============================================================ */

/* ---------- 工具 ---------- */
const KEY = 'cri_v2';
const pad = n => String(n).padStart(2, '0');
const dateStr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const timeStr = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const todayStr = () => dateStr(new Date());
const monthStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const el = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function addDays(n, base) {
  const d = base ? new Date(base) : new Date();
  d.setDate(d.getDate() + n);
  return dateStr(d);
}
function daysBetween(a, b) {
  const d1 = new Date(a + 'T00:00:00'), d2 = new Date(b + 'T00:00:00');
  return Math.round((d2 - d1) / 86400000);
}
function md(s) { return String(s || '').slice(5).replace('-', '/'); }
function uid(p) { return p + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }

/* ---------- 角色与人员 ---------- */
/* 账号来源：钉钉扫码登录，默认授予「预览」（只读）角色；
   整改回复人等其他角色与车间范围由巡检人或合规管理在系统内（账号与权限）单独设置 */
const ROLES = {
  inspector: { key: 'inspector', name: '巡检人', cls: 'r-ins', desc: '分配巡检任务、执行巡检、登记发现项',
    src: '钉钉 · QA巡检组' },
  compliance: { key: 'compliance', name: '合规管理', cls: 'r-com', desc: '确认发现项、干预巡检任务、维护车间主数据',
    src: '钉钉 · 质量保证部' },
  production: { key: 'production', name: '整改回复人', cls: 'r-pro', desc: '一周内回复整改措施与责任人（由巡检人 / 合规管理单独授予）',
    src: '钉钉 · 生产制造部' },
  preview: { key: 'preview', name: '预览', cls: 'r-prev', desc: '只读查看巡检数据（钉钉登录默认角色）',
    src: '钉钉 · 默认' }
};
/* 钉钉扫码登录后的默认角色：预览（只读），由巡检人 / 合规管理在「我的」中调整 */
const DEFAULT_ROLE = 'preview';

const STAFF = {
  inspector: { name: '张伟', emp: 'EMP-2043', shops: [] },
  compliance: { name: '陈晓', emp: 'EMP-1088', shops: [] },
  production: { name: '王强', emp: 'EMP-0312', shops: ['W3', 'W7'] },
  preview: { name: '访客', emp: 'EMP-0000', shops: [] }
};

/* 登录名归一化与校验：允许字母/数字/下划线/点/连字符/@/+（兼容邮箱形式），长度 1–64 */
const LOGIN_RE = /^[A-Za-z0-9_.@+-]{1,64}$/;
const normLogin = v => String(v == null ? '' : v).trim().toLowerCase();
/* 部门选项（开通账号时选择；AI 分析按整改回复人所属部门归纳） */
const DEPTS = ['CMU', 'CMD', 'CMF'];

/* 账号表迁移（幂等）：兼容 v1 的 dept 字段与「按姓名绑定」的旧数据，
   为老账号补登录名，并把中文姓名键的绑定迁移到登录名键 */
const LEGACY_LOGIN = { '张伟': 'zhangwei', '李静': 'lijing', '周敏': 'zhoumin', '陈晓': 'chenxiao',
  '赵磊': 'zhaolei', '王强': 'wangqiang', '刘洋': 'liuyang' };
function migrateAccounts(data) {
  const accs = data.accounts || [];
  const rb = data.roleBindings || (data.roleBindings = {});
  accs.forEach(a => {
    if (a.dept === undefined) a.dept = ''; // 部门（CMU/CMD/CMF），供 AI 按部门分析
    // 补登录名：优先沿用同名种子账号的登录名
    if (!a.login) {
      const same = DEFAULT_ACCOUNTS.find(x => x.name === a.name);
      const guess = (same && same.login) || LEGACY_LOGIN[a.name] || '';
      if (guess) a.login = normLogin(guess);
    }
    // 旧绑定键（按姓名写入）→ 迁移到登录名键
    const oldKey = normLogin(a.name);
    if (a.login && oldKey && oldKey !== a.login && rb[oldKey]) {
      if (!rb[a.login]) rb[a.login] = rb[oldKey];
      delete rb[oldKey];
    }
  });
  // 清理失效绑定：既不是登录名也不对应任何账号的键（保留手填的登录名绑定）
  Object.keys(rb).forEach(k => {
    if (!ROLES[rb[k]]) { delete rb[k]; return; }
    if (normLogin(k) !== k) { rb[normLogin(k)] = rb[k]; delete rb[k]; }
  });
  // 房间整改回复人多选迁移（幂等）：replyOwner(单选字符串) → replyOwners(数组)，replyOwner 保留为展示串
  (data.workshops || []).forEach(w => (w.rooms || []).forEach(r => {
    if (!Array.isArray(r.replyOwners)) r.replyOwners = r.replyOwner ? [r.replyOwner] : [];
  }));
  return data;
}

/* EJSON 宽松解析：{"$numberInt":"2"} → 2 */

    if (typeof v.$numberLong === 'string') return Number(v.$numberLong);
    if (typeof v.$numberDouble === 'string') return Number(v.$numberDouble);
    if (v.$date !== undefined) return typeof v.$date === 'string' ? v.$date : new Date(v.$date.$numberLong * 1).toISOString();
    const o = {};

    .then(r => r.json().then(j => {

/* ---------- 数据保护：云端快照 / 本地多版本 / 备份恢复 / 骤减护栏 ---------- */
const SNAP = { prefix: 'snap_', keep: 30, minGap: 10 * 60 * 1000, lastAt: 0 };
const HIST_KEY = 'cri_v2_hist';
const HIST_KEEP = 5;

function dataStats(d) {
  const ws = (d && d.workshops) || [];
  return {
    ws: ws.length,
    rooms: ws.reduce((n, w) => n + ((w.rooms || []).length), 0),
    acc: ((d && d.accounts) || []).length,
    bind: Object.keys((d && d.roleBindings) || {}).length,
    task: ((d && d.tasks) || []).length,
    find: ((d && d.findings) || []).length

}
function stampNow() {
  const t = new Date(), p = n => String(n).padStart(2, '0');
  return `${t.getFullYear()}-${p(t.getMonth() + 1)}-${p(t.getDate())} ${p(t.getHours())}:${p(t.getMinutes())}`;
}
function snapDocId(rev) {
  const t = new Date(), p = n => String(n).padStart(2, '0');
  return `${SNAP.prefix}${t.getFullYear()}${p(t.getMonth() + 1)}${p(t.getDate())}T${p(t.getHours())}${p(t.getMinutes())}${p(t.getSeconds())}_r${rev}`;

/* 通用文档读写（快照文档用；仅 REST 网关通道可用） */
function restGetDoc(id) {

    .then(r => r.json().then(j => {
      if (j && j.code === 'DOCUMENT_NOT_FOUND') return null;
      if (j && j.code) throw new Error(j.message || j.code);
      return ejsonNorm(j);
    }));
}
function restPutDoc(id, obj) {
  return restToken().then(tk => fetch(restDbUrl('/' + id), {

  }));
}

    .then(r => r.json().then(j => {

}

    .then(r => r.json().then(j => {

function snapWrite(rev, data, note) {

    note: note || '', stats: dataStats(data), data

    .then(() => { SNAP.lastAt = Date.now(); return true; })

/* 自动快照：写入前留档上一版；10 分钟内不重复，避免每次编辑都多写一份 */
function snapMaybe(rev, data, note) {
  if (!data) return;
  if (CLOUD.snappedRev === rev) return;
  if (Date.now() - SNAP.lastAt < SNAP.minGap) return;
  CLOUD.snappedRev = rev;

function snapListCloud() {

    .filter(d => String(d.id || '').indexOf(SNAP.prefix) === 0)

    .sort((a, b) => String(b.id).localeCompare(String(a.id))));

/* 本地多版本缓存（L2）：保留最近 5 个版本，超配额自动裁旧 */
function histList() {
  try { return JSON.parse(localStorage.getItem(HIST_KEY) || '[]') || []; } catch (e) { return []; }
}
function histSig(d) {
  const s = dataStats(d);
  return [s.ws, s.rooms, s.acc, s.bind, s.task, s.find].join('-') + '|' + hashStr(d);
}
/* djb2 字符串哈希：用于判断两版内容是否真的不同（避免编辑后签名不变） */
function hashStr(obj) {
  let str;
  try { str = JSON.stringify(obj); } catch (e) { return '0'; }
  let h = 5381;
  for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0;
  return (h >>> 0).toString(36) + '_' + str.length.toString(36);
}
function histSave(data) {
  if (!data || !Array.isArray(data.workshops)) return;
  try {
    let arr = histList();
    const sig = histSig(data);
    if (arr[0] && arr[0].sig === sig) arr[0].at = stampNow();
    else arr.unshift({ at: stampNow(), sig, stats: dataStats(data), data: JSON.parse(JSON.stringify(data)) });
    arr = arr.slice(0, HIST_KEEP);
    const write = a => localStorage.setItem(HIST_KEY, JSON.stringify(a));
    try { write(arr); return; } catch (e) { /* 配额不足 → 逐步降级 */ }
    // 降级 1：去掉历史版本里的照片（保留当前版）
    const slim = JSON.parse(JSON.stringify(arr));
    slim.forEach((v, i) => {
      if (i === 0) return;
      (v.data.findings || []).forEach(f => { f.photos = []; if (f.reply) f.reply.photos = []; });
    });
    try { write(slim); return; } catch (e) { /* 继续降级 */ }
    // 降级 2：只保留最近 2 版
    try { write(slim.slice(0, 2)); } catch (e) { console.warn('本地历史写入失败', e && e.message); }
  } catch (e) { console.warn('历史版本保存异常', e && e.message); }
}
/* 骤减护栏（L4）：关键数据量比上一版明显减少时先确认 */
function dropCheck(prev, next) {
  if (!prev || !next) return null;
  const a = dataStats(prev), b = dataStats(next), out = [];
  const chk = (k, label, minAbs, ratio) => {
    if (a[k] >= minAbs && b[k] < a[k] * ratio) out.push({ label, from: a[k], to: b[k] });
  };
  chk('rooms', '房间', 3, 0.7);
  chk('acc', '账号', 2, 0.8);
  chk('bind', '权限绑定', 2, 0.8);
  chk('task', '巡检任务', 3, 0.7);
  chk('find', '发现项', 3, 0.7);
  return out.length ? out : null;
}

function persist() {
  try {
    localStorage.setItem(KEY, JSON.stringify(D()));
  } catch (e) {
    // 本机空间不足：先丢掉历史版本缓存腾空间，保证当前数据能落盘
    try {
      localStorage.removeItem(HIST_KEY);
      localStorage.setItem(KEY, JSON.stringify(D()));
    } catch (e2) { console.warn('存储失败', e2); }
  }
  histSave(D());
  if (CLOUD.on) cloudPush();
}

/* ---------- 文档型数据库适配层 ---------- */
/* CloudBase 单实例：登录与数据库共用一个 app 对象（SDK 限制每个环境只能有一个 auth 实例） */
function tcbApp() {
  if (!CLOUD_DB.env || !window.cloudbase) return null;
  if (!CLOUD_DB.app) {
    CLOUD_DB.app = window.cloudbase.init({
      env: CLOUD_DB.env, region: CLOUD_DB.region,
      ...(CLOUD_DB.clientId ? { clientId: CLOUD_DB.clientId } : {}),
      ...(CLOUD_DB.accessKey ? { accessKey: CLOUD_DB.accessKey } : {})
    });
  }
  return CLOUD_DB.app;
}
function dbReady() {
  if (CLOUD_DB.db) return Promise.resolve(CLOUD_DB.db);
  if (!CLOUD_DB.env) return Promise.reject(new Error('no env'));
  if (!window.cloudbase) return Promise.reject(new Error('sdk missing'));
  CLOUD_DB.app = tcbApp();
  CLOUD_DB.db = CLOUD_DB.app.database();
  return Promise.resolve(CLOUD_DB.db);
}
/* 数据库通道：直连网关（REST）优先，SDK 方式仅当 REST 不可用时兜底 */
function dbLoad() {
  // REST：网关返回单文档对象；SDK：返回 { data: [...] }
  if (restNeed()) return restLoadDb();
  return dbReady().then(db => db.collection(CLOUD_DB.collection).doc(CLOUD_DB.docId).get())
    .then(r => {
      const d = r && r.data && (r.data[0] || r.data);
      if (d && typeof d.rev === 'number') return { rev: d.rev, data: d.data || null };
      return { rev: 0, data: null };
    });
}
function dbSave(rev, data) {
  if (restNeed()) return restSaveDb(rev, data);
  return dbReady().then(db => db.collection(CLOUD_DB.collection).doc(CLOUD_DB.docId)
    .set({ rev, data, updatedAt: new Date().toISOString() }))
    .then(() => ({ rev, data }));
}

function cloudInit() {
  // 优先文档型数据库；失败再试同步服务；都失败则本地模式
  return tryDbBackend().then(ok => ok ? true : tryHttpBackend()).catch(() => tryHttpBackend());
}
function tryDbBackend() {
  if (!CLOUD_DB.env) return Promise.resolve(false);
  // REST 直连不依赖 window.cloudbase，先判可用性
  if (!restNeed() && !window.cloudbase) return Promise.resolve(false);
  return dbLoad().then(j => {
    CLOUD.on = true; CLOUD.mode = 'db'; CLOUD.rev = j.rev;
    if (!j.data || !Array.isArray(j.data.workshops) || !j.data.workshops.length) {
      // 数据库尚无数据 → 用种子数据初始化
      return cloudPush().then(() => { CLOUD.timer = setInterval(cloudPoll, 4000); return true; });
    }
    if (isSeedLike(j.data) && localIsCustom()) {
      // 云端只剩初始数据、本机有真实数据 → 回写本机，避免真实数据被种子覆盖
      CLOUD.guard = true;
      cloudPush();
      CLOUD.timer = setInterval(cloudPoll, 4000);
      return true;
    }
    applyCloudData(j.data);
    CLOUD.timer = setInterval(cloudPoll, 4000);
    return true;
  }).catch(e => { console.warn('文档型数据库不可用：', e && e.message); return false; });
}
function tryHttpBackend() {
  if (typeof fetch !== 'function' || !/^https?:$/.test(location.protocol)) return Promise.resolve(false);
  return fetch('/api/data', { cache: 'no-store' }).then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(j => {
      if (!j || typeof j.rev !== 'number') return false;
      CLOUD.on = true; CLOUD.mode = 'http'; CLOUD.rev = j.rev;
      if (!j.data || !Array.isArray(j.data.workshops) || !j.data.workshops.length) {
        return cloudPush().then(() => { CLOUD.timer = setInterval(cloudPoll, 4000); return true; });
      }
      applyCloudData(j.data);
      CLOUD.timer = setInterval(cloudPoll, 4000);
      return true;
    })
    .catch(() => false);
}
/* 防覆盖护栏：云端若只剩初始种子数据（例如被清库/被新设备初始化），
   而本机还保有真实数据，则拒绝用种子覆盖本机，改为把本机数据回写云端。 */
let SEED_SIG = null;
function seedSig() {
  if (!SEED_SIG) {
    const s = seed();
    SEED_SIG = {
      ws: s.workshops.map(w => w.name + '|' + (w.rooms || []).map(r => r.name).join(',')).join(';'),
      acc: (s.accounts || []).map(a => a.login).join(',')
    };
  }
  return SEED_SIG;
}
function dataSig(d) {
  if (!d || !Array.isArray(d.workshops)) return '';
  return {
    ws: d.workshops.map(w => w.name + '|' + (w.rooms || []).map(r => r.name).join(',')).join(';'),
    acc: (d.accounts || []).map(a => a.login).join(',')
  };
}
function isSeedLike(d) {
  const a = dataSig(d), b = seedSig();
  return !!a && a.ws === b.ws && a.acc === b.acc;
}
function localIsCustom() { return !isSeedLike(D()); }

function applyCloudData(data) {
  S.data = data;
  if (!S.data.accounts) S.data.accounts = JSON.parse(JSON.stringify(DEFAULT_ACCOUNTS));
  if (!S.data.roleBindings) S.data.roleBindings = { 'shunchao_zhang': 'compliance' };
  if (!S.data.roleLog) S.data.roleLog = [];
  if (!S.data.drafts) S.data.drafts = { find: null, reply: {} };
  // 账号表迁移：清 dept、补登录名、迁移旧绑定键
  migrateAccounts(S.data);
  try { localStorage.setItem(KEY, JSON.stringify(D())); } catch (e) { /* 本地缓存失败可忽略 */ }
  // 记住云端这一版，作为下次写入前留快照 / 骤减比对的基线
  try { CLOUD.base = JSON.parse(JSON.stringify(S.data)); } catch (e) { CLOUD.base = null; }
}

function cloudPush() {
  if (!CLOUD.on) return Promise.resolve(false);
  if (CLOUD.pushing) { CLOUD.pending = true; return Promise.resolve(false); }
  // 骤减护栏：关键数据明显变少 → 先让用户确认，确认后放行这一次
  if (!CLOUD.dropAck && CLOUD.mode === 'db' && CLOUD.base) {
    const drops = dropCheck(CLOUD.base, D());
    if (drops) { CLOUD.dropPending = drops; openSheet({ type: 'dropWarn', drops }); return Promise.resolve(false); }
  }
  CLOUD.dropAck = false;
  CLOUD.pushing = true;
  const nextRev = CLOUD.rev + 1;
  // 写入前给上一版留快照（节流；失败不影响保存）
  if (CLOUD.mode === 'db' && CLOUD.base) snapMaybe(CLOUD.rev, CLOUD.base, '自动快照');
  const send = CLOUD.mode === 'db'
    ? dbSave(nextRev, D()).then(() => ({ ok: true }))
    : fetch('/api/data', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ rev: CLOUD.rev, data: D() })
      }).then(r => r.json().then(j => ({ ok: r.ok, j })));
  return send.then(res => {
    if (res.ok) {
      CLOUD.rev = nextRev; CLOUD.err = false;
      try { CLOUD.base = JSON.parse(JSON.stringify(D())); } catch (e) { CLOUD.base = null; }
      if (nextRev % 20 === 0) snapPruneCloud();   // 每 20 次写入清理一次旧快照
      return true;
    }
    if (res.j && typeof res.j.rev === 'number' && res.j.data) {
      // 冲突（他人已先提交）：以服务端最新版本为准
      CLOUD.rev = res.j.rev; applyCloudData(res.j.data);
      toast('数据已被其他用户更新，已同步到最新版本');
      render();
    }
    return false;
  }).catch(() => { CLOUD.err = true; return false; })
    .finally(() => { CLOUD.pushing = false; if (CLOUD.pending) { CLOUD.pending = false; cloudPush(); } });
}

function cloudPoll() {
  if (!CLOUD.on || CLOUD.pushing) return;
  const pull = CLOUD.mode === 'db' ? dbLoad()
    : fetch('/api/data', { cache: 'no-store' }).then(r => r.ok ? r.json() : Promise.reject(r.status));
  pull.then(j => {
    if (j && typeof j.rev === 'number' && j.rev !== CLOUD.rev && j.data) {
      if (isSeedLike(j.data) && localIsCustom()) {   // 云端被初始数据覆盖 → 拒绝覆盖，反向回写
        CLOUD.rev = j.rev;
        CLOUD.guard = true;
        cloudPush();
        return;
      }
      CLOUD.rev = j.rev; applyCloudData(j.data);
      render();
    }
  }).catch(() => { /* 下一次轮询重试 */ });
}
function restore() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const o = JSON.parse(raw);
      if (o && Array.isArray(o.tasks) && Array.isArray(o.workshops) && o.workshops.length) return o;
    }
  } catch (e) { console.warn('读取失败', e); }
  // 主缓存不可用 → 退到本地多版本缓存里的最新一版
  try {
    const h = histList();
    if (h.length && h[0].data && Array.isArray(h[0].data.workshops) && h[0].data.workshops.length) {
      console.warn('主缓存不可用，已从本地历史版本恢复（' + h[0].at + '）');
      return h[0].data;

  return null;
}

function findingsOfTask(tid) { return D().findings.filter(f => f.taskId === tid); }
function taskStatus(t) {
  const fs = findingsOfTask(t.id);
  if (t.status === 'pending' || t.status === 'doing') return t.status;
  if (!fs.length) return 'closed';
  if (fs.every(f => f.status === 'replied')) return 'closed';
  if (fs.some(f => f.status === 'pending' || f.status === 'returned')) {
    return fs.some(f => f.status === 'confirmed' || f.status === 'replied') ? 'processing' : 'submitted';
  }
  return 'processing';
}
function roomsChecked(t) {
  const st = t.rooms || {};
  return Object.keys(st).filter(k => st[k].checked).length;
}
function replyDueLabel(f) {
  if (!f.replyDue || f.status !== 'confirmed') return '';
  const d = daysBetween(todayStr(), f.replyDue);
  if (d < 0) return `已超期 ${-d} 天`;
  if (d === 0) return '今日到期';
  return `剩余 ${d} 天`;
}
function overdue(f) { return f.status === 'confirmed' && f.replyDue && f.replyDue < todayStr(); }

function monthCoverage() {
  const m = month();
  const wss = D().workshops;
  const submitted = wss.filter(w => D().tasks.some(t => t.month === m && t.workshopId === w.id && t.status !== 'pending' && t.status !== 'doing'));
  return { total: wss.length, done: submitted.length, list: wss.map(w => {
    const t = D().tasks.find(x => x.month === m && x.workshopId === w.id);
    return { w, t, ok: !!t && t.status !== 'pending' && t.status !== 'doing' };
  }) };
}

  }).then(r => r.json().then(j => {

      err.code = j && (j.error_code || j.code);

    }

    try { localStorage.setItem(REST_AUTH_KEY, JSON.stringify({ token: j.access_token, at: REST.tokenAt, user: j.user || null })); } catch (e) { /* 忽略 */ }

function restAuthRestore() {

      REST.token = o.token; REST.tokenAt = o.at;

function restAuthApi(method, path, body) {
  if (!REST.token) return Promise.reject(new Error('无 REST 登录态：请退出后用「账号密码」方式重新登录，再执行此操作'));
  return fetch(`https://${CLOUD_DB.env}.api.tcloudbasegateway.com/auth/v1/${path}`, {
    method: method, headers: restHeaders(REST.token),
    body: body ? JSON.stringify(body) : undefined
  }).then(r => r.json().then(j => {
    if (r.status >= 400 || !j || j.error) {
      const err = new Error(j && (j.error_description || j.error) || ('请求失败（' + r.status + '）'));
      err.code = j && j.error_code; err.status = r.status;
      throw err;
    }

  }));
}
/* CloudBase Web v2 认证 API：
   发码 auth.getVerification({ phone_number | email }) → { verification_id, is_user }
   手机登录 auth.signInWithSms({ verificationInfo, verificationCode, phoneNum })
   邮箱登录 auth.signInWithEmail({ verificationInfo, verificationCode, email })
   密码登录 auth.signIn({ username, password })

const phoneE164 = s => { s = String(s || '').trim(); return /^\+/.test(s) ? s : ('+86 ' + s); };
const maskPhone = p => { const s = String(p || '').trim(); return s.length >= 7 ? s.slice(0, 3) + '****' + s.slice(-4) : s; };
const maskEmail = e => { const s = String(e || '').trim(); const i = s.indexOf('@'); return i > 2 ? s.slice(0, 2) + '***' + s.slice(i) : s; };
const fmtAuthErr = (e, fallback) => {
  if (!e) return fallback;
  const code = e.code || e.error_code || e.status || '';
  const msg = e.message || e.error_message || e.msg || '';
  // WebKit 网络中断的原始报错对用户无意义，翻译成可执行的提示
  if (/unreachable|networkerror|failed to fetch|load failed/i.test(msg))
    return '网络不可达：请检查手机网络后重试（若反复失败，请切换 Wi-Fi / 蜂窝网络）';

};
const loginStateUser = ls => {

function authGuard() {
  if (!authEnabled()) { AUTH.on = false; AUTH.user = null; renderLogin(); return Promise.resolve(false); }
  AUTH.on = true; renderLogin();
  const app = authApp();
  // SDK 未就绪：走 REST 通道（会话本地存续）
  if (!app) {
    const u = restAuthRestore();
    AUTH.user = u || null;
    AUTH.on = !u;
    renderLogin();
    if (u) afterLogin(u, true);
    return Promise.resolve(!!u);
  }
  const auth = typeof app.auth === 'function' ? app.auth() : app.auth;
  const finish = u => {
    AUTH.user = u;
    AUTH.on = !u;
    renderLogin();
    if (u) afterLogin(u, true);   // 会话恢复也要投递身份 + 应用权限绑定（静默，不弹「登录成功」）
    return !!u;

  const pickUser = res => {
    if (!res) return null;
    if (res.data) return res.data.user || (res.data.session ? res.data : null);
    return res.user || (res.uid ? res : null);
  };
  const probe = auth.getSession
    ? auth.getSession().then(r => pickUser(r)).catch(() => null)
    : (auth.getCurrentUser
        ? auth.getCurrentUser().then(u => u || null).catch(() => null)
        : (auth.getLoginState ? auth.getLoginState() : Promise.resolve(null))
            .then(s => (s && s.user) || null).catch(() => null));

  if (!quiet) toast(S.role === DEFAULT_ROLE ? '登录成功（未分配权限，当前只读预览）'
    : `登录成功，已绑定角色：${ROLES[S.role].name}`);
  else if (roleChanged) toast(`已按账号绑定切换角色：${ROLES[S.role].name}`);
  // 登录前 cloudInit 已因未认证而降级本地模式，登录成功后重新连接云端
  if (CLOUD_DB.env && !CLOUD.on && !CLOUD.timer) cloudInit().then(on => { if (on) render(); });
  render();
}

/* 「我的」页展示的登录账号 */
function loginLabel() {
  const u = CLOUD.user || {};
  return u.username || u.email || u.phone || (u.id ? String(u.id).slice(0, 12) : '已登录');
}
/* 本地模式原因（用于「我的」页诊断展示） */
function cloudFailReason() {
  if (!CLOUD_DB.env) return '未配置环境';
  if (!restNeed() && !window.cloudbase) return '网络 SDK/网关均不可用';
  if (restFailed) return '网关不可达' + (REST.lastErr ? '：' + REST.lastErr : '');
  if (CLOUD.err) return '云端推送失败';
  return '尚未连接，可点右侧重试';
}
/* 退出登录：清除 CloudBase 会话，回到登录页，角色回落默认 */
function doLogout() {
  const app = authApp();
  const auth = app ? (typeof app.auth === 'function' ? app.auth() : app.auth) : null;
  const fin = () => {
    AUTH.user = null; AUTH.info = null; AUTH.err = ''; AUTH.sending = false;
    CLOUD.user = null;
    // 还原出厂角色形象（去掉云端账号覆盖的姓名/工号）
    Object.keys(STAFF0).forEach(k => { STAFF[k] = Object.assign({}, STAFF0[k]); });
    S.role = DEFAULT_ROLE;
    if (AUTH.on !== undefined) AUTH.on = true;
    restAuthClear();
    renderLogin(); render();
    toast('已退出登录');
  };
  if (auth && auth.signOut) {
    Promise.resolve(auth.signOut()).catch(() => {}).then(fin);
  } else fin();
}

function boot() {
  const stored = restore();
  S.data = stored || seed();
  // 兼容旧版本本地数据：补齐账号表与变更日志
  if (!S.data.accounts) S.data.accounts = JSON.parse(JSON.stringify(DEFAULT_ACCOUNTS));
  if (!S.data.roleBindings) S.data.roleBindings = { 'shunchao_zhang': 'compliance' };
  if (!S.data.roleLog) S.data.roleLog = [];
  if (!S.data.drafts) S.data.drafts = { find: null, reply: {} };
  // 账号表迁移：清 dept、补登录名、迁移旧绑定键
  migrateAccounts(S.data);
  if (!stored) persist();
  render();
  // 云端同步：优先文档型数据库 → 同步服务 → 本地模式
  cloudInit().then(on => { if (on) render(); });
  // 登录提醒：按登录账号计算待办，原型内 toast 提示（正式环境经钉钉工作通知推送）
  setTimeout(() => {
    if (!CLOUD.user) return; // 未登录（或已退出）不弹「欢迎回来」，避免出现演示人物名
    const rn = myReminders().length;
    const acc = (D().accounts || []).find(a => a.name === me().name);
    if (rn) toast(`欢迎回来，${me().name}${acc ? '（' + acc.emp + '）' : ''}，有 ${rn} 条待办提醒已推送到你的账号`);
    else if (acc) toast(`欢迎回来，${me().name}（${acc.emp}），当前无超期待办`);
  }, 400);
}

  <div class="sec-title"><h3>任务变更记录</h3><span>${t.history.length} 条</span></div>
  <div class="card" style="padding:4px 14px">

      <div style="padding:9px 0;${i < arr.length - 1 ? 'border-bottom:1px solid #F2F6F8' : ''}">
        <div class="row" style="justify-content:space-between;gap:8px">
          <span style="font-size:12.5px;font-weight:650">${esc(h.act)}</span>
          <span class="tiny" style="font-family:ui-monospace,Menlo,monospace">${esc(h.at)}</span>

function fcard(f, opts) {
  const w = wsOf(f.workshopId);
  const r = roomOf(f.workshopId, f.roomId);
  const st = FIND_ST[f.status];
  const od = overdue(f);
  return `
  <div class="fcard lv-${f.level}" data-act="fdetail" data-id="${f.id}">
    <div class="fc-h">
      <div class="fc-t">${esc(f.title)}</div>
      <span class="tag ${LEVELS[f.level].cls}">${LEVELS[f.level].name}</span>${catTags(f)}
    </div>
    <div class="fc-loc">
      <span>${esc(w.name)}</span><span>·</span><span>${r ? r.code : ''} ${r ? r.name : ''}</span>
    </div>
    ${f.photos && f.photos.length ? `<div class="photos">${f.photos.map(u => `<img src="${u}" alt="现场照片">`).join('')}</div>` : ''}
    <div class="fc-foot">
      <span>${esc(f.foundBy)} · ${md(f.foundAt)}</span>
      <span class="tag ${od ? 'danger' : st.cls}">${od ? '超期未回复' : st.name}${f.status === 'confirmed' && !od ? ' · ' + replyDueLabel(f) : ''}</span>
    </div>
  </div>`;
}

/* ============================================================
   房间巡检
   ============================================================ */
function renderRoom() {
  const t = taskOf(S.sub.taskId);
  const w = wsOf(t.workshopId);
  const r = roomOf(t.workshopId, S.sub.roomId);
  if (!r) return '<div class="empty"><b>房间不存在</b></div>';
  const rs = (t.rooms || {})[r.id] || {};
  const fs = D().findings.filter(f => f.taskId === t.id && f.roomId === r.id);
  const canEdit = can('inspect', t);

  return `
  <div class="pt-head card">
    <div class="row" style="justify-content:space-between;align-items:flex-start">
      <div>
        <div style="font-size:15.5px;font-weight:700">${esc(r.name)}</div>
        <div class="tiny" style="margin-top:5px">${r.code} · ${esc(w.name)}</div>
      </div>
      <span class="tag ${rs.checked ? (fs.length ? 'danger' : 'ok') : 'gray'}">
        ${rs.checked ? (fs.length ? `发现 ${fs.length} 项` : '无异常') : '未检查'}</span>
    </div>
    ${rs.checked && rs.at ? `<div class="tiny" style="margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)">检查时间 ${rs.at}</div>` : ''}
  </div>

  <div class="sec-title"><h3>本房间发现项</h3><span>${fs.length} 项</span></div>

    <div class="tiny" style="margin-top:5px">如现场无异常，可点击下方「标记本房间无异常」</div>

  ${canEdit ? `
  <div class="row" style="gap:9px;margin-top:14px">

  </div>`;
}

/* ============================================================
   记录列表（巡检人 / 生产）
   ============================================================ */
function renderRecords() {
  let list = D().findings.slice();
  if (S.role === 'inspector') list = list.filter(f => f.foundBy === me().name);
  if (S.role === 'production') list = list.filter(f => (f.status === 'confirmed' || f.status === 'replied') && (!S.mineOnly || inMyShops(f)));
  if (S.role === 'preview') list = list.filter(f => f.status === 'confirmed' || f.status === 'replied'); // 预览：仅已确认
  if (S.role === 'compliance') list = list.filter(f => can('confirmFind', f) || f.status !== 'pending');
  list.sort((a, b) => (b.foundAt || '').localeCompare(a.foundAt || ''));

  const chips = [
    { k: 'all', n: '全部' },
    { k: 'pending', n: '待确认' },
    { k: 'confirmed', n: '待回复' },
    { k: 'replied', n: '已回复' }
  ];
  const shown = S.filter === 'all' ? list : list.filter(f => f.status === S.filter);

  return `
  <div class="card" style="padding:12px 14px;margin-bottom:2px">
    <div class="row" style="justify-content:space-between">
      <div>
        <div class="tiny">${S.role === 'inspector' ? '我登记的发现项' : '需生产处理的发现项'}</div>
        <div style="font-size:20px;font-weight:750;margin-top:2px">${list.length}<span style="font-size:11px;font-weight:500;color:var(--ink3);margin-left:6px">项</span></div>
      </div>
      <div class="row" style="gap:6px">
        <span class="tag danger">重大 ${list.filter(f => f.level === 'critical').length}</span>
        <span class="tag warn">主要 ${list.filter(f => f.level === 'major').length}</span>
      </div>

  </div>
  <div class="chips" style="display:flex;gap:7px;overflow-x:auto;padding:10px 14px;margin:0 -14px">
    ${chips.map(c => `<button class="chip ${S.filter === c.k ? 'on' : ''}" data-act="filter" data-k="${c.k}"
      style="border:1px solid ${S.filter === c.k ? 'var(--ink)' : 'var(--line)'};background:${S.filter === c.k ? 'var(--ink)' : '#fff'};
      color:${S.filter === c.k ? '#fff' : 'var(--ink2)'};border-radius:999px;padding:6px 12px;font-size:11.5px;font-weight:600;white-space:nowrap;cursor:pointer;font-family:inherit">
      ${c.n}</button>`).join('')}

      <button class="chip ${S.mineOnly ? 'on' : ''}" data-act="mineOnly"
        style="margin-left:auto;border:1px solid ${S.mineOnly ? 'var(--pri)' : 'var(--line)'};
        background:${S.mineOnly ? 'var(--pri-l)' : '#fff'};color:${S.mineOnly ? 'var(--pri)' : 'var(--ink2)'};

  ${shown.length ? shown.map(f => fcard(f)).join('') : `<div class="empty"><b>暂无记录</b>切换筛选条件查看</div>`}`;
}

/* ============================================================

  const returned = D().findings.filter(f => f.status === 'returned');

  const pickedValid = picked.filter(id => pending.some(f => f.id === id));
  const allPicked = pending.length > 0 && pickedValid.length === pending.length;

  return `
  <div class="kpi-grid" style="margin-bottom:4px">
    <div class="kpi"><b style="color:${pending.length ? '#BF7A12' : '#0F1E28'}">${pending.length}</b>

  <div class="sec-title"><h3>待确认清单</h3><span>确认后转生产回复</span></div>
  ${pending.length ? `
  <div class="card" style="padding:10px 12px;margin-bottom:9px">
    <div class="row" style="justify-content:space-between;gap:8px">
      <button class="row" style="gap:7px;border:none;background:none;padding:0;cursor:pointer" data-act="pickAll">
        <i style="width:17px;height:17px;border-radius:5px;display:flex;align-items:center;justify-content:center;
          border:1.5px solid ${allPicked ? '#0F8378' : '#C6D2D8'};background:${allPicked ? '#0F8378' : '#fff'};

      </button>
      <button class="btn btn-pri btn-sm" style="flex:0 0 auto;padding:6px 12px" data-act="batchConfirm">
        批量确认${pickedValid.length ? ' ' + pickedValid.length + ' 项' : ''}</button>
    </div>
  </div>` : ''}
  ${pending.length ? pending.map(f => {
    const on = pickedValid.indexOf(f.id) >= 0;
    return `
    <div class="tcard" style="padding:12px">
      <div class="row" style="gap:9px;align-items:flex-start">
        <i data-act="pickOne" data-id="${f.id}" style="width:17px;height:17px;border-radius:5px;flex:0 0 17px;margin-top:2px;
          display:flex;align-items:center;justify-content:center;cursor:pointer;
          border:1.5px solid ${on ? '#0F8378' : '#C6D2D8'};background:${on ? '#0F8378' : '#fff'};
          color:#fff;font-size:11px;font-style:normal">${on ? '✓' : ''}</i>
        <div style="flex:1;min-width:0">
          <div class="fc-h">
            <div class="fc-t">${esc(f.title)}</div>
            <span class="tag ${LEVELS[f.level].cls}">${LEVELS[f.level].name}</span>${catTags(f)}
          </div>
          <div class="fc-loc"><span>${esc(wsOf(f.workshopId).name)}</span><span>·</span>
            <span>${roomOf(f.workshopId, f.roomId).code} ${roomOf(f.workshopId, f.roomId).name}</span>
            ${f.foundBy === me().name ? '<span class="tag gray" style="font-size:9px">本人登记</span>' : ''}</div>
        </div>
      </div>
      <div class="tiny" style="margin-top:8px;line-height:1.65;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(f.desc)}</div>
      ${f.photos && f.photos.length ? `<div class="photos">${f.photos.map(u => `<img src="${u}" alt="现场照片">`).join('')}</div>` : ''}
      <div class="row" style="gap:8px;margin-top:10px">

  }).join('') : `<div class="empty">

  ${returned.length ? `

      <div class="fc-loc"><span>${esc(wsOf(f.workshopId).name)}</span><span>·</span>
        <span>${roomOf(f.workshopId, f.roomId).name}</span></div>
      <div class="fc-foot" style="border-top:none;padding-top:4px;margin-top:6px">

      <button class="btn btn-pri btn-sm" style="width:100%;margin-top:9px" data-act="openReply" data-id="${f.id}">

      <b>没有待回复的发现项</b>合规确认后会推送至生产</div>`}

  ${done.length ? `
  <div class="sec-title"><h3>近期已回复</h3><span>${done.length} 项</span></div>
  ${done.slice(0, 5).map(f => `
    <div class="fcard lv-${f.level}" data-act="fdetail" data-id="${f.id}">
      <div class="fc-h"><div class="fc-t">${esc(f.title)}</div><span class="tag ok">已回复</span></div>
      <div class="fc-foot" style="border-top:none;padding-top:4px;margin-top:4px">
        <span>责任人 ${esc(f.reply ? f.reply.owner : '')}</span>
        <span>${f.reply ? md(f.reply.at) : ''}</span>

    </div>`).join('')}` : ''}`;
}

/* ============================================================
   AI 分析与整改建议（按产线 + 发现项内容，依据可切换法规库）
   规则引擎：命中关键词 → 风险判定 + 可能原因 + 分法规的整改建议
   后续可无缝升级为在线 LLM 分析（接口预留 aiAnalyze 单入口）
   ============================================================ */
const AI_STD = {
  cn:  { name: '中国 GMP', cite: '《药品生产质量管理规范（2010 年修订）》及附录' },
  fda: { name: 'FDA cGMP', cite: '21 CFR Parts 210/211 及 Aseptic Processing 指南（2004）' },
  eu:  { name: 'EU GMP', cite: 'EudraLex Vol.4 Part I 及 Annex 1（2022 修订）' }
};

/* 产线画像：从车间名/编号推断生产场景，影响风险侧重点 */
function lineProfile(w) {
  const n = (w && (w.name || '') + ' ' + (w.code || '')) || '';
  if (/ADC/.test(n)) return { key: 'adc', label: 'ADC（抗体偶联药物）', focus: '细胞毒性物料的高致敏/高活性特性，交叉污染与人员职业暴露防护是最高优先级' };
  if (/细胞库/.test(n)) return { key: 'cellbank', label: '细胞库（种子批管理）', focus: '主细胞库/工作细胞库的可追溯性与储运完整性，一旦污染将影响整条产品链' };
  if (/原液/.test(n)) return { key: 'ds', label: '原液（Drug Substance）', focus: '生物负载控制与层析/超滤工艺的清洁保持，污染直接影响下游制剂批次' };
  if (/制剂|灌装|冻干/.test(n)) return { key: 'dp', label: '无菌制剂（Drug Product）', focus: '无菌保证水平（SAL）与密封完整性，缺陷直接威胁患者安全' };
  return { key: 'generic', label: '药品生产', focus: '按常规 GMP 风险管理评估' };
}

/* 规则库：kw 命中关键词（任一）；risk 风险判定；causes 可能原因；sug = {cn,fda,eu} 各自的整改建议（含法规出处） */

    causes: ['送/排风机组故障或高效过滤器（HEPA）泄漏', '压差表未校准或联锁报警失效', '房间气锁/传递窗使用不规范导致压差瞬断'],
    sug: {
      cn: ['立即恢复压差梯度（A/B ≥10Pa，B/C ≥10Pa，不同级别间 ≥10Pa），期间已暴露物料按偏差处理', '排查 HEPA 安装/泄漏（PAO 检漏），更换后重新验证气流流型与自净时间', '将压差表纳入校准计划并恢复报警联锁——依据：中国 GMP（2010）附录1 无菌药品 · 洁净区压差与气流要求'],
      fda: ['进行影响评估：暴露于异常气流/压差的产品批次会议（质量单元）判定处置（放行/拒绝/返工）', '按 21 CFR 211.68 记录并调查设备故障根因，修订预防性维护计划', '恢复后执行气流可视化（烟雾试验）确认 A 级区单向流——依据：FDA Sterile Drug Products Produced by Aseptic Processing (2004) §IV.C'],
      eu: ['按 Annex 1（2022）§5.11-5.13 恢复压差梯度并连续监测，记录须可追溯', 'HEPA 更换/检漏后重新进行气流流型确认，证明无湍流死角——依据：EU GMP Annex 1 §5 洁净区与环境控制'] } },
  { n: '温湿度控制', kw: ['温湿度', '温度', '湿度'],

/* 单发现项分析入口（后续接在线 LLM 也从这里替换） */
function aiAnalyze(f, w) {
  const text = [f.title, f.desc, (f.cats || []).join(' ')].join(' ');
  const prof = lineProfile(w);
  const hits = GMP_RULES.filter(r => r.kw.some(k => text.indexOf(k) >= 0));
  const rules = hits.length ? hits.slice(0, 2) : [];
  const riskParts = rules.map(r => r.risk);
  const causes = [];
  const sug = { cn: [], fda: [], eu: [] };
  rules.forEach((r, ri) => {
    r.causes.forEach(c => { if (causes.indexOf(c) < 0) causes.push(c); });
    ['cn', 'fda', 'eu'].forEach(std => (r.sug[std] || []).forEach(x => {
      if (sug[std].indexOf(x) < 0) sug[std].push(x);
    }));
  });
  if (prof.key === 'adc' && sug.cn.length) { ADC_RULE.sug.cn.forEach(x => sug.cn.push(x)); ADC_RULE.sug.fda.forEach(x => sug.fda.push(x)); ADC_RULE.sug.eu.forEach(x => sug.eu.push(x)); }
  const risk = (f.level === 'critical' ? '【重大 · 直接影响产品质量与患者安全】' : f.level === 'major' ? '【中度 · 系统性风险】' : '【轻微 · 局部执行偏差】') +
    ' ' + (riskParts.length ? riskParts.join('；') : '按通用 GMP 风险管理评估：需结合偏差调查确认影响范围与根因') +
    '。产线场景：' + prof.label + '——' + prof.focus + '。';
  return { prof, rules: rules.length, risk, causes, sug };
}

/* ---------- 独立「AI 分析」模块：按时间 × 产线聚合分析 ---------- */
const AI_RANGES = { m1: '本月', m3: '近 3 月', all: '全部' };
const AI_VIEWS = { line: '按产线', dept: '按部门' };
function inAiRange(f, k) {
  if (k === 'all') return true;
  const m = String(f.foundAt || '').slice(0, 7);
  if (k === 'm1') return m === month();
  const d = new Date(); const arr = [];
  for (let i = 0; i < 3; i++) {
    const dt = new Date(d.getFullYear(), d.getMonth() - i, 1);
    arr.push(dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0'));
  }
  return arr.indexOf(m) >= 0;
}
/* 规则聚合：对一组发现项做关键词匹配与趋势统计（产线 / 部门两个维度共用） */
function ruleAgg(list) {
  const ruleHit = {}, causes = [], trend = {};
  const sug = { cn: [], fda: [], eu: [] };
  list.forEach(f => {
    const text = [f.title, f.desc, (f.cats || []).join(' ')].join(' ');
    GMP_RULES.forEach(r => {
      if (!r.kw.some(kw => text.indexOf(kw) >= 0)) return;
      ruleHit[r.n] = (ruleHit[r.n] || 0) + 1;
      r.causes.forEach(c => { if (causes.indexOf(c) < 0) causes.push(c); });
      ['cn', 'fda', 'eu'].forEach(std => (r.sug[std] || []).forEach(x => { if (sug[std].indexOf(x) < 0) sug[std].push(x); }));
    });
    const m = String(f.foundAt || '').slice(0, 7);
    trend[m] = (trend[m] || 0) + 1;
  });
  return {
    ruleHit, causes, sug, trend,
    topRules: Object.keys(ruleHit).sort((a, b) => ruleHit[b] - ruleHit[a]).slice(0, 3),
    months: Object.keys(trend).sort()
  };
}
/* 发现项 → 整改责任人名单（自动分配 + 回复时填写），用于按部门归纳 */
function findingOwners(f) {
  const own = [];
  (Array.isArray(f.autoOwners) ? f.autoOwners : (f.autoOwner ? String(f.autoOwner).split(/[、,，]/) : []))
    .forEach(x => { const n = String(x || '').trim(); if (n && own.indexOf(n) < 0) own.push(n); });
  const ro = f.reply && f.reply.owner ? String(f.reply.owner) : '';
  ro.split(/[、,，]/).forEach(x => { const n = x.trim(); if (n && own.indexOf(n) < 0) own.push(n); });
  return own;
}
/* 整改责任人姓名 → 部门（CMU/CMD/CMF）映射 */
function ownerDeptMap() {
  const map = {};
  (D().accounts || []).forEach(a => { if (a.dept) map[a.name] = a.dept; });
  return map;
}
/* 按部门聚合：发现项的部门 = 其整改责任人所属部门（多部门各计一次，无责任人归「未分组」） */
function aiDeptReport(k) {
  const dm = ownerDeptMap();
  const groups = {}; DEPTS.forEach(d => { groups[d] = []; });
  groups['未分组'] = [];
  const ownersByDept = {}; DEPTS.forEach(d => { ownersByDept[d] = []; });
  (D().findings || []).filter(f => inAiRange(f, k)).forEach(f => {
    const ds = [];
    findingOwners(f).forEach(n => {
      const d = dm[n];
      if (d && ds.indexOf(d) < 0) { ds.push(d); if (ownersByDept[d].indexOf(n) < 0) ownersByDept[d].push(n); }
    });
    (ds.length ? ds : ['未分组']).forEach(d => groups[d].push(f));
  });
  return DEPTS.concat(['未分组']).map(d => {
    const list = groups[d];
    const agg = ruleAgg(list);
    const critical = list.filter(f => f.level === 'critical').length;
    const score = critical * 5 + list.filter(f => f.level === 'major').length * 2 + list.filter(f => f.level === 'minor').length * 1;
    return {
      dept: d, list, count: list.length, critical, score,
      grade: score >= 10 ? '高' : score >= 4 ? '中' : list.length ? '低' : '—',
      owners: ownersByDept[d] || [], agg
    };
  });
}
function aiLineReport(w, k) {
  const list = (D().findings || []).filter(f => f.workshopId === w.id && inAiRange(f, k));
  const agg = ruleAgg(list);
  const prof = lineProfile(w);
  const critical = list.filter(f => f.level === 'critical').length;
  const score = critical * 5 + list.filter(f => f.level === 'major').length * 2 + list.filter(f => f.level === 'minor').length * 1;
  const grade = score >= 10 ? '高' : score >= 4 ? '中' : list.length ? '低' : '—';
  if (prof.key === 'adc') {
    agg.sug.cn.push('产线级建议：ADC 专用线每季度评估一次密闭防护与毒素残留清洁验证的符合性，纳入年度产品回顾（APR）');
    agg.sug.fda.push('产线级建议：将 ADC 毒素暴露偏差纳入质量风险管理（ICH Q9），评审共用设施 PDE 限度');
    agg.sug.eu.push('产线级建议：CCS 年度评审中单独复核 ADC 线的隔离/密闭控制章节');
  }
  return Object.assign({ list, count: list.length, critical, score, grade, prof }, agg);
}

/* ============================================================
   统计
   ============================================================ */
const PERIODS = { month: '本月', quarter: '本季度', year: '本年度' };
/* 产线维度：车间上的 line 字段分组，车间可后续增删 */
function lineList() {
  const seen = [];
  D().workshops.forEach(w => {
    const l = w.line || w.code;
    if (seen.indexOf(l) < 0) seen.push(l);
  });
  return seen;
}
function lineName(l) {
  if (l === 'all') return '全部产线';
  const ws = D().workshops.filter(w => (w.line || w.code) === l);
  return ws.length === 1 ? ws[0].name : `${l}（${ws.length}个车间）`;
}
/* 当前产线多选下的可选车间：用于统计页的车间分布 */
function scopeWs() {
  const sel = S.lines || [];
  return D().workshops.filter(w => !sel.length || sel.indexOf(w.line || w.code) >= 0);
}
/* 产线筛选按钮上的文案 */
function lineSelLabel() {
  const sel = (S.lines || []).filter(l => lineList().indexOf(l) >= 0);
  if (!sel.length) return '全部产线';
  return sel.length === 1 ? sel[0] : `已选 ${sel.length} 条产线`;
}
function inPeriod(d) {
  if (!d) return false;
  const today = todayStr();
  if (S.period === 'quarter') {
    const q = Math.floor((+today.slice(5, 7) - 1) / 3);
    return d.slice(0, 4) === today.slice(0, 4) && Math.floor((+d.slice(5, 7) - 1) / 3) === q;
  }
  const n = S.period === 'year' ? 4 : 7;
  return d.slice(0, n) === today.slice(0, n);
}
function periodCoverage() {
  const today = todayStr();
  const months = [];
  if (S.period === 'month') months.push(today.slice(0, 7));
  else if (S.period === 'quarter') {
    const y = today.slice(0, 4), q = Math.floor((+today.slice(5, 7) - 1) / 3);
    for (let i = 0; i < 3; i++) months.push(`${y}-${pad(q * 3 + i + 1)}`);
  }
  const inT = t => S.period === 'year' ? t.month.slice(0, 4) === today.slice(0, 4) : months.indexOf(t.month) >= 0;
  const ws = scopeWs();
  const list = ws.map(w => {
    const t = D().tasks.find(t => t.workshopId === w.id && inT(t));
    return { w, t, ok: !!t && t.status !== 'pending' && t.status !== 'doing' };
  });
  return { total: ws.length, done: list.filter(c => c.ok).length, list };
}

function renderStats() {
  if (!S.period) S.period = 'month';
  const lines = lineList();
  // 兼容旧数据 / 失效产线清理
  S.lines = (S.lines || []).filter(l => lines.indexOf(l) >= 0);
  const wsIds = scopeWs().map(w => w.id);
  const fs = D().findings.filter(f => inPeriod((f.foundAt || '').slice(0, 10)) && wsIds.indexOf(f.workshopId) >= 0);
  const cov = periodCoverage();
  const byLevel = { critical: 0, major: 0, minor: 0, advice: 0 };
  fs.forEach(f => { byLevel[f.level] = (byLevel[f.level] || 0) + 1; });
  const total = fs.length;

  const byWs = scopeWs().map(w => ({ w, n: fs.filter(f => f.workshopId === w.id).length }))
    .sort((a, b) => b.n - a.n);
  const maxWs = Math.max(1, byWs[0] ? byWs[0].n : 1);

  // 发现项分类统计（一条发现项可属多个分类，分类计数之和 ≥ 总数）
  const catRows = CATEGORIES.map(c => ({ c, n: fs.filter(f => (f.cats || []).indexOf(c) >= 0).length }))
    .sort((a, b) => b.n - a.n);
  const unCat = fs.filter(f => !(f.cats || []).length).length;
  if (unCat) catRows.push({ c: '未分类', n: unCat });
  const maxCat = Math.max(1, catRows.length ? catRows[0].n : 1);

  const replied = fs.filter(f => f.status === 'replied');
  const overdueCnt = fs.filter(overdue).length;
  const onTime = replied.filter(f => f.reply && f.replyDue && f.reply.at.slice(0, 10) <= f.replyDue).length;
  const onTimeRate = replied.length ? Math.round(onTime / replied.length * 100) : 100;

  const colors = { critical: '#D33F3F', major: '#E0A03A', minor: '#5B8DC9', advice: '#9AAAB8' };
  const R = 50, C = 2 * Math.PI * R;
  let off = 0;
  const segs = Object.keys(LEVELS).map(k => {
    const v = byLevel[k];
    const len = total ? C * v / total : 0;
    const s = v ? `<circle cx="64" cy="64" r="${R}" fill="none" stroke="${colors[k]}" stroke-width="17"
      stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"
      transform="rotate(-90 64 64)"/>` : '';
    off += len;
    return s;
  }).join('');

  const periodBar = `
  <div class="row" style="gap:0;background:#EEF3F5;border-radius:10px;padding:3px;margin-bottom:12px">
    ${Object.keys(PERIODS).map(k => `
      <button data-act="statPeriod" data-k="${k}" style="flex:1;border:none;border-radius:8px;padding:7px 0;
        font-size:12.5px;font-weight:600;cursor:pointer;transition:all .15s;
        ${S.period === k ? 'background:#fff;color:#0F8378;box-shadow:0 1px 4px rgba(15,30,40,.12)' : 'background:transparent;color:#7C9590'}">
        ${PERIODS[k]}</button>`).join('')}
  </div>`;

  const lineDrop = `
  <div style="position:relative;margin:-4px 0 12px">
    <button data-act="lineDrop" style="width:100%;display:flex;align-items:center;gap:8px;
      border:1px solid ${(S.lines || []).length ? 'var(--pri)' : 'var(--line)'};
      background:${(S.lines || []).length ? 'var(--pri-l)' : '#fff'};
      border-radius:10px;padding:9px 12px;cursor:pointer;font-family:inherit;text-align:left">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="${(S.lines || []).length ? 'var(--pri)' : 'var(--ink2)'}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-4h6v4M9 10h.01M15 10h.01M9 14h.01M15 14h.01"/></svg>
      <span style="flex:1;font-size:12.5px;font-weight:650;color:${(S.lines || []).length ? 'var(--pri)' : 'var(--ink)'}">产线：${esc(lineSelLabel())}</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--ink3)" stroke-width="2.4" stroke-linecap="round"
        style="transition:transform .15s;${S.lineOpen ? 'transform:rotate(180deg)' : ''}"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    ${S.lineOpen ? `
    <div style="position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:30;background:#fff;
      border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 28px rgba(15,30,40,.14);padding:6px">
      <div class="tiny" style="padding:6px 10px 4px">可多选，统计口径为所选产线之和</div>
      ${lines.map(l => {
        const on = (S.lines || []).indexOf(l) >= 0;
        const n = D().workshops.filter(w => (w.line || w.code) === l).length;
        return `<div data-act="linePick" data-k="${esc(l)}" style="display:flex;align-items:center;gap:9px;
          padding:9px 10px;border-radius:8px;cursor:pointer;${on ? 'background:#F2F9F7' : ''}">
          <i style="width:17px;height:17px;border-radius:5px;flex:0 0 17px;display:flex;align-items:center;justify-content:center;
            border:1.5px solid ${on ? '#0F8378' : '#C6D2D8'};background:${on ? '#0F8378' : '#fff'};color:#fff;font-size:11px;font-style:normal">${on ? '✓' : ''}</i>
          <span style="flex:1;font-size:12.5px;font-weight:${on ? '650' : '500'};color:var(--ink)">${esc(l)}</span>
          <span class="tiny">${n} 个车间</span>
        </div>`;
      }).join('')}
      <div class="row" style="gap:8px;padding:7px 8px 5px;border-top:1px dashed var(--line);margin-top:4px">
        <button class="btn btn-line btn-sm" style="flex:1" data-act="lineClear">全部产线</button>
        <button class="btn btn-pri btn-sm" style="flex:1" data-act="lineDrop">完成</button>
      </div>
    </div>` : ''}
    ${(S.lines || []).length ? `<div class="tiny" style="margin-top:7px">
      当前口径：${esc((S.lines || []).join('、'))}，数据仅统计该 ${wsIds.length} 个车间的合计
    </div>` : ''}
  </div>`;

  return `
  ${periodBar}${lineDrop}
  <div class="kpi-grid">
    <div class="kpi"><b>${cov.done}/${cov.total}</b><span>${PERIODS[S.period]}车间覆盖</span>
      <i style="background:var(--pri-l);color:var(--pri)">${cov.total ? Math.round(cov.done / cov.total * 100) : 0}%</i></div>
    <div class="kpi"><b style="color:${total ? '#D33F3F' : '#0F1E28'}">${total}</b><span>发现项总数</span>
      <i style="background:var(--amber-l);color:var(--amber)">重大 ${byLevel.critical}</i></div>
    <div class="kpi"><b style="color:${overdueCnt ? '#D33F3F' : '#0F1E28'}">${overdueCnt}</b><span>超期未回复</span>
      <i style="background:var(--red-l);color:var(--red)">需跟进</i></div>
    <div class="kpi"><b>${onTimeRate}%</b><span>回复及时率</span>
      <i style="background:var(--green-l);color:var(--green)">${onTime}/${replied.length}</i></div>
  </div>

  <div class="sec-title"><h3>发现项级别分布</h3><span>${PERIODS[S.period]}${(S.lines || []).length ? ' · ' + esc(lineSelLabel()) : ''}</span></div>
  <div class="card">
    <div class="row" style="gap:16px">
      <div style="position:relative;width:128px;height:128px;flex:0 0 128px">
        <svg width="128" height="128" viewBox="0 0 128 128">
          <circle cx="64" cy="64" r="${R}" fill="none" stroke="#EEF3F5" stroke-width="17"/>
          ${segs}
        </svg>
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
          <div style="font-size:22px;font-weight:750;letter-spacing:-.5px">${total}</div>
          <div class="tiny" style="margin-top:1px">发现项</div>
        </div>
      </div>
      <div style="flex:1">
        ${Object.keys(LEVELS).map(k => `
          <div class="row" style="justify-content:space-between;margin-bottom:9px">
            <span class="row" style="gap:6px;font-size:11.5px;color:var(--ink2)">
              <i style="width:8px;height:8px;border-radius:2px;background:${colors[k]};display:block"></i>${LEVELS[k].name}
            </span>
            <b style="font-size:13px">${byLevel[k]}</b>
          </div>`).join('')}
        <div class="tiny" style="margin-top:8px;border-top:1px dashed var(--line);padding-top:8px;line-height:1.6">
          处理节奏：待确认 ${fs.filter(f => f.status === 'pending').length} · 待回复 ${fs.filter(f => f.status === 'confirmed').length} · 已回复 ${replied.length}
        </div>
      </div>
    </div>
  </div>

  <div class="sec-title"><h3>发现项分类统计</h3><span>${PERIODS[S.period]}${(S.lines || []).length ? ' · ' + esc(lineSelLabel()) : ''}</span></div>
  <div class="card">
    ${catRows.some(x => x.n) ? catRows.map(x => `
      <div class="bar-row" title="${esc(x.c)}">
        <span class="bl" style="width:150px;flex:0 0 150px">${esc(x.c)}</span>
        <div class="bar-track"><i style="width:${Math.round(x.n / maxCat * 100)}%"></i></div>
        <span class="bv">${x.n}</span>
      </div>`).join('')
    : `<div class="tiny" style="padding:6px 0;line-height:1.7">当前口径内暂无分类数据。登记发现项时选择分类、或回复时修订分类后即可在此查看分布。</div>`}
    ${catRows.some(x => x.n) ? `<div class="tiny" style="margin-top:8px;border-top:1px dashed var(--line);padding-top:8px;line-height:1.6">
      一条发现项可属于多个分类，各分类计数之和可能大于发现项总数${unCat ? `；其中 ${unCat} 条尚未选择分类` : ''}。</div>` : ''}
  </div>

  <div class="sec-title"><h3>车间发现项分布</h3><span>${(S.lines || []).length ? esc(lineSelLabel()) : '按数量排序'}</span></div>
  <div class="card">
    ${byWs.map(x => `
      <div class="bar-row">
        <span class="bl">${esc(x.w.name)}</span>
        <div class="bar-track"><i style="width:${Math.round(x.n / maxWs * 100)}%"></i></div>
        <span class="bv">${x.n}</span>
      </div>`).join('')}
  </div>

  <div class="sec-title"><h3>${PERIODS[S.period]}车间巡检覆盖</h3><span>${cov.done}/${cov.total}</span></div>
  <div class="card" style="padding:6px 14px">
    ${cov.list.map(c => `
      <div class="row" style="justify-content:space-between;padding:9px 0;border-bottom:1px solid #F2F6F8">
        <span style="font-size:12.5px">${esc(c.w.name)}</span>
        <span class="tag ${c.ok ? 'ok' : c.t ? 'warn' : 'danger'}">
          ${c.ok ? '已巡检' : c.t ? TASK_ST[taskStatus(c.t)].name : '未安排'}</span>
      </div>`).join('')}
  </div>

  ${can('exportAll') ? `
  <div class="row" style="gap:9px;margin-top:14px">
    <button class="btn btn-line" style="flex:1" data-act="dataMgr">按日期导出 / 删除</button>
  </div>
  <div class="tiny" style="margin:8px 4px 0;line-height:1.7">
    选择日期区间后可批量导出 Excel，或清理该区间的历史数据；删除会记入审计日志。
  </div>` : ''}`;
}

/* ============================================================
   我的
============================================================ */
function renderMe() {
  const m = me();
  const r = ROLES[S.role];
  const fs = D().findings;
  const mine = S.role === 'inspector' ? fs.filter(f => f.foundBy === m.name)
    : S.role === 'compliance' ? fs.filter(f => f.confirmBy === m.name)
      : fs.filter(f => f.reply && f.reply.owner === m.name);
  const todo = S.role === 'inspector' ? D().tasks.filter(t => t.assignee === m.name && ['pending', 'doing'].indexOf(taskStatus(t)) >= 0).length
    : S.role === 'compliance' ? fs.filter(f => f.status === 'pending').length
      : fs.filter(f => f.status === 'confirmed').length;

  return `
  <div class="card" style="padding:16px">
    <div class="row" style="gap:12px">
      <div style="width:50px;height:50px;border-radius:15px;display:flex;align-items:center;justify-content:center;
        font-size:19px;font-weight:700;color:#fff;flex:0 0 50px;
        background:${S.role === 'compliance' ? 'linear-gradient(135deg,#2563C9,#4A8AE0)' : S.role === 'production' ? 'linear-gradient(135deg,#C77A1E,#E0A03A)' : S.role === 'preview' ? 'linear-gradient(135deg,#5A6B7A,#8496A5)' : 'linear-gradient(135deg,#0F8378,#18A795)'}">
        ${m.name.slice(0, 1)}</div>
      <div style="flex:1">
        <div style="font-size:16px;font-weight:700">${m.name}<span class="tag pri" style="margin-left:7px">${r.name}</span></div>
        <div class="tiny" style="margin-top:5px">${m.emp}</div>
      </div>
    </div>
    <div class="row" style="margin-top:11px;padding:8px 10px;background:${CLOUD.on ? '#F2F9F7' : '#F4F6F8'};border-radius:8px;gap:6px">
      <span style="font-size:11px;color:var(--ink3)">数据模式</span>
      <span style="font-size:11.5px;font-weight:600;color:${CLOUD.on ? 'var(--pri)' : 'var(--ink2)'}">${CLOUD.on ? '多人共享（云端实时同步）' : '本地模式（' + cloudFailReason() + '）'}</span>
      ${!CLOUD.on && CLOUD_DB.env ? '<span data-act="cloudRetry" style="margin-left:auto;font-size:11.5px;font-weight:600;color:var(--blue);cursor:pointer;white-space:nowrap">重新连接</span>' : ''}
    </div>
    ${authEnabled() && CLOUD.user ? `<div class="row" style="margin-top:6px;padding:7px 10px;border-radius:8px;gap:6px;background:#F4F8FA">
      <span style="font-size:11px;color:var(--ink3)">登录账号</span>
      <span style="font-size:11.5px;font-weight:600;color:var(--ink2);word-break:break-all">${esc(loginLabel())}</span>
      <span data-act="logout" style="margin-left:auto;font-size:11.5px;font-weight:600;color:var(--red);cursor:pointer;white-space:nowrap">退出登录</span>
    </div>` : ''}
    ${S.role === 'production' && myShops().length ? `<div class="tiny" style="margin-top:8px;line-height:1.6">
      分管车间：${myShops().map(id => (wsOf(id) || {}).name).filter(Boolean).join('、')}（可查看全部车间数据）</div>` : ''}
    <div class="row" style="margin-top:14px;border-top:1px dashed var(--line);padding-top:12px;text-align:center">
      <div style="flex:1"><div style="font-size:15px;font-weight:700;color:${todo ? 'var(--amber)' : 'inherit'}">${todo}</div><div class="tiny">待办事项</div></div>
      <div style="flex:1;border-left:1px solid #F0F4F6"><div style="font-size:15px;font-weight:700">${mine.length}</div><div class="tiny">经手记录</div></div>
      <div style="flex:1;border-left:1px solid #F0F4F6"><div style="font-size:15px;font-weight:700">${S.role === 'production' ? myShops().length : D().workshops.length}</div><div class="tiny">${S.role === 'production' ? '分管车间' : '在管车间'}</div></div>
    </div>
  </div>

  <div class="sec-title"><h3>我的权限</h3><span>按角色自动授予</span></div>
  <div class="card" style="padding:12px 14px">
    <div style="display:flex;flex-wrap:wrap;gap:6px">
      ${myPerms().map(n => `<span class="tag pri" style="font-size:10.5px">${esc(n)}</span>`).join('')}
    </div>
    <div class="tiny" style="margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);line-height:1.7">
      ${S.role === 'inspector' ? `数据范围：本人负责 / 本人创建的任务与发现项<br>限制：不能确认发现项、不能改他人任务、不能改车间主数据`
        : S.role === 'compliance' ? `数据范围：全部车间与记录<br>限制：不能代填巡检记录、不能代生产回复`
          : `数据范围：全部车间（分管车间用于快捷筛选）<br>限制：不能确认 / 退回、不能改级别、不能分配巡检任务`}
    </div>
  </div>

  ${can('manageRole') ? accountCardHTML() : ''}

  <div class="sec-title"><h3>角色说明</h3><span>演示用，可切换</span></div>
  <div class="card" style="padding:0 14px">
    ${Object.keys(ROLES).map(k => `
      <div class="row" style="justify-content:space-between;padding:12px 0;border-bottom:1px solid #F2F6F8">
        <div>
          <div style="font-size:12.5px;font-weight:650">${ROLES[k].name}${S.role === k ? ' <span class="tag pri">当前</span>' : ''}</div>
          <div class="tiny" style="margin-top:2px">${ROLES[k].desc}</div>
        </div>
        <span class="tag ${S.role === k ? 'ok' : 'gray'}">${S.role === k ? '使用中' : '可切换'}</span>
      </div>`).join('')}
  </div>

  <div class="sec-title"><h3>常用功能</h3><span></span></div>
  <div class="card" style="padding:0 14px">
    ${[
      { act: 'help', n: '使用说明', d: '登录、巡检、确认整改、权限分配一站式指引', show: true },
      { act: 'newTask', n: '分配巡检任务', d: '指派给自己或组内同事，可改派 / 改期', show: S.role === 'inspector' },
      { act: 'goConfig', n: '车间与房间管理', d: `${D().workshops.length} 车间 · ${D().workshops.reduce((n, w) => n + w.rooms.length, 0)} 房间，可新增 / 编辑 / 删除`, show: can('manageData') },
      { act: 'goConfig', n: '巡检配置', d: `频率 ${D().settings.freq} 次/月 · 回复 ${D().settings.replyDays} 天`, show: can('configPolicy') },
      { act: 'export', n: '导出全部巡检数据', d: 'Excel 文件：发现项明细 + 任务汇总两个工作表', show: can('exportAll') },
      { act: 'dataMgr', n: '按日期导出 / 删除', d: '选择日期区间批量导出，或清理历史数据', show: can('exportAll') },
      { act: 'dataProtect', n: '数据保护', d: '历史版本回滚 · 一键快照 · 备份导出导入', show: can('exportAll') },
      { act: 'goAudit', n: '审计追踪', d: '角色变更、房间回复人调整、数据删除留痕', show: can('viewAudit') },
      { act: 'roleSheet', n: '切换角色', d: '巡检人 / 合规管理 / 整改回复人 / 预览', show: true },
      { act: 'chgPwd', n: '修改密码', d: '旧密码校验后修改 CloudBase 登录密码', show: authEnabled() && !!CLOUD.user },
      { act: 'logout', n: '退出登录', d: authEnabled() && CLOUD.user ? `当前账号 ${loginLabel()}` : '未启用云端登录', show: authEnabled() && !!CLOUD.user }
    ].filter(i => i.show).map((i, ix, arr) => `
      <div class="row" style="justify-content:space-between;padding:13px 0;${ix < arr.length - 1 ? 'border-bottom:1px solid #F2F6F8' : ''};cursor:pointer" data-act="${i.act}">
        <div>
          <div style="font-size:13px;font-weight:600">${i.n}</div>
          <div class="tiny" style="margin-top:2px">${i.d}</div>
        </div>
        <span style="color:${i.act === 'logout' ? 'var(--red)' : 'var(--ink3)'};font-size:11.5px;font-weight:600">›</span>
      </div>`).join('')}
  </div>

  <div class="sec-title"><h3>流程说明</h3><span></span></div>
  <div class="card tiny" style="line-height:1.9">
    1. 合规管理或巡检人按「每车间每月至少 1 次」分配任务，可指派给自己或组内同事，并支持改派 / 改期<br>
    2. 巡检人逐房间检查，发现问题即登记（内容 + 照片 + 级别）<br>
    3. 合规管理确认发现项，可调整级别或退回补充<br>
    4. 整改回复人在 ${D().settings.replyDays} 天内回复整改措施并手动填写责任人<br>
    5. 全部回复后任务自动闭环，数据归档可导出
  </div>`;
}

/* 账号与角色分配卡片（巡检人 / 合规管理可见）——默认折叠，按角色计数摘要 */
function accountCardHTML() {
  const accs = D().accounts || [];
  const open = !!S.sub.accOpen;
  const cnt = {};
  accs.forEach(u => { cnt[u.role] = (cnt[u.role] || 0) + 1; });
  const chips = Object.keys(cnt).map(k => `<span class="tag ${k === 'compliance' ? 'info' : k === 'production' ? 'warn' : 'ok'}" style="font-size:10px">${ROLES[k].name} · ${cnt[k]}</span>`).join('');
  return `
  <div class="sec-title"><h3>账号与角色分配</h3><span style="cursor:pointer;color:var(--pri);font-weight:600" data-act="accToggle">${open ? '收起 ∧' : '展开 ∨'}</span></div>
  <div class="card" style="padding:0 14px">
    <div class="row" data-act="accToggle" style="gap:6px;padding:11px 0;cursor:pointer;flex-wrap:wrap;${accs.length ? '' : 'border-bottom:1px solid #F2F6F8'}">
      ${chips || '<span class="tiny">暂无账号</span>'}
      <span class="tiny" style="margin-left:auto;color:var(--pri)">${open ? '收起' : '共 ' + accs.length + ' 个'}</span>
    </div>
    ${open ? `
    ${accs.map((u, i, arr) => `
      <div class="row" style="justify-content:space-between;padding:9px 0;${i < arr.length - 1 ? 'border-bottom:1px solid #F2F6F8' : ''}">
        <div style="flex:1;min-width:0;cursor:pointer" data-act="editAccount" data-emp="${u.emp}">
          <div style="font-size:12.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(u.name)}
            <span class="tiny" style="margin-left:6px;font-weight:400">${esc(u.emp)}</span>
            ${u.emp === me().emp ? '<span class="tag pri" style="font-size:9px;margin-left:4px">我</span>' : ''}
          </div>
          <div class="tiny" style="margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${u.dept ? esc(u.dept) + ' · ' : ''}${u.login ? esc(u.login) : '未设置登录名'}${u.shops && u.shops.length ? ' · 分管 ' + u.shops.map(id => (wsOf(id) || {}).name).filter(Boolean).join('、') : ''}</div>
        </div>
        <span class="row" style="gap:6px;flex:0 0 auto">
          ${u.dept ? `<span class="tag gray" style="font-size:9px">${esc(u.dept)}</span>` : ''}
          <span class="tag ${u.role === 'compliance' ? 'info' : u.role === 'production' ? 'warn' : 'ok'}" style="font-size:10px">
            ${ROLES[u.role].name}</span>
          <span data-act="delAccount" data-emp="${u.emp}" style="font-size:11px;font-weight:600;color:var(--red);cursor:pointer;padding:2px 4px">删除</span>
        </span>
