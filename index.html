/* ============================================================
   语音转文字（浏览器内置 Web Speech API）
   - 仅 Chrome / Edge / 企业微信内置浏览器等 Chromium 内核可用
   - 录音仅在浏览器内识别，识别结果直接写入输入框，不做本地存音频
   ============================================================ */
/* 用函数取值而非 const 固化，便于不支持时优雅降级与自动化测试注入 */
function SRClass() {
  return typeof window !== 'undefined' && (window.SpeechRecognition || window.webkitSpeechRecognition);
}
function voiceSupported() { return !!SRClass(); }

/* 听写字段名映射（标题 / 描述 / 整改措施） */
const VOICE_FIELDS = { title: '标题', desc: '描述', measures: '整改措施' };
function voiceFieldName(f) { return VOICE_FIELDS[f] || '内容'; }

function voiceStop() {
  if (S.voice && S.voice.rec) {
    S.voice.manual = true;           // 标记为主动停止，避免 onend 自动重启
    try { S.voice.rec.stop(); } catch (e) { /* 已结束 */ }
  }
  S.voice = null;
}
function voiceStart(field) {
  if (!voiceSupported()) { toast('当前浏览器不支持语音识别，请改用键盘输入'); return; }
  // 已在录同一字段 → 停止
  if (S.voice && S.voice.field === field) { voiceStop(); renderSheet(); return; }
  voiceStop();

  const rec = new (SRClass())();
  rec.lang = 'zh-CN';
  rec.continuous = true;
  rec.interimResults = true;
  const st = { rec, field, manual: false, finalText: '' };
  S.voice = st;

  rec.onresult = (ev) => {
    let interim = '', fin = '';
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const r = ev.results[i];
      if (r.isFinal) fin += r[0].transcript;
      else interim += r[0].transcript;
    }
    if (fin) st.finalText += fin;
    applyVoiceText(field, st.finalText + interim);
    const tip = document.getElementById('voiceTip');
    if (tip) tip.textContent = `正在听写${voiceFieldName(field)}（普通话）… ${
      (st.finalText + interim).slice(-16) || '请开口说话'}`;
  };
  rec.onerror = (ev) => {
    const map = {
      'not-allowed': '麦克风权限被拒绝，请在浏览器设置中允许后重试',
      'service-not-allowed': '浏览器未提供语音识别服务，请改用键盘输入',
      'no-speech': '没有听到声音，请靠近麦克风重试',
      'audio-capture': '未检测到麦克风设备',
      'network': '语音识别网络异常，请检查网络后重试'
    };
    const msg = map[ev.error] || `语音识别失败（${ev.error}）`;
    voiceStop();
    renderSheet();
    toast(msg);
  };
  rec.onend = () => {
    // continuous 模式下部分浏览器仍会静默结束，未主动停止则续接
    if (S.voice === st && !st.manual) {
      try { rec.start(); return; } catch (e) { /* 无法重启则收尾 */ }
    }
    if (S.voice === st) { S.voice = null; renderSheet(); }
  };

  try { rec.start(); } catch (e) { S.voice = null; toast('语音识别启动失败'); return; }
  renderSheet();
}

/* 把识别文本回填到当前 sheet 草稿（不整体重绘，避免打断输入与录音） */
function applyVoiceText(field, text) {
  const s = S.sheet;
  if (!s || !s.draft) return;
  s.draft[field] = field === 'title' ? text.slice(0, 40) : text;
  const node = document.querySelector(`#sheet [data-f="${field}"]`);
  if (node) {
    if (S.voice) S.voice.applying = true;
    node.value = s.draft[field];
    if (S.voice) S.voice.applying = false;
  }
}

/* ============================================================
   登录账号提醒（超期未回复 / 巡检任务到期）
   - 原型内：登录后顶部铃铛角标 + 提醒列表；正式环境对接钉钉工作通知推送到登录账号
   ============================================================ */
function daysDiff(d) { return Math.round((new Date(d + 'T00:00:00') - new Date(todayStr() + 'T00:00:00')) / 86400000); }
function myReminders() {
  const out = [];
  const m = me();
  if (S.role === 'inspector') {
    D().tasks.forEach(t => {
      if (t.assignee !== m.name || ['pending', 'doing'].indexOf(taskStatus(t)) < 0) return;
      const left = daysDiff(t.due);
      if (left < 0) out.push({ kind: 'task', id: t.id, lv: 'danger',
        title: `巡检任务已超期 ${-left} 天`,
        desc: `${wsOf(t.workshopId).name} · 期限 ${t.due}，请尽快完成巡检并提交`,
        page: 'wdetail', sub: { taskId: t.id } });
      else if (left <= 2) out.push({ kind: 'task', id: t.id, lv: 'warn',
        title: left === 0 ? '巡检任务今日到期' : `巡检任务还剩 ${left} 天到期`,
        desc: `${wsOf(t.workshopId).name} · 期限 ${t.due}`,
        page: 'wdetail', sub: { taskId: t.id } });
    });
  }
  if (S.role === 'production') {
    D().findings.forEach(f => {
      if (f.status !== 'confirmed') return;
      const left = daysDiff(f.replyDue);
      if (left < 0) out.push({ kind: 'find', id: f.id, lv: 'danger',
        title: `整改回复已超期 ${-left} 天`,
        desc: `${wsOf(f.workshopId).name} · ${f.title} · 期限 ${f.replyDue}`,
        page: 'fdetail', sub: { findId: f.id } });
      else if (left <= 1) out.push({ kind: 'find', id: f.id, lv: 'warn',
        title: left === 0 ? '整改回复今日到期' : '整改回复明天到期',
        desc: `${wsOf(f.workshopId).name} · ${f.title} · 期限 ${f.replyDue}`,
        page: 'fdetail', sub: { findId: f.id } });
    });
  }
  if (S.role === 'compliance') {
    const pending = D().findings.filter(f => f.status === 'pending');
    if (pending.length) out.push({ kind: 'confirm', id: '', lv: 'warn',
      title: `${pending.length} 项发现项待确认`,
      desc: '巡检人提交后等待合规确认，确认后转生产回复',
      page: 'confirm', sub: {} });
    D().findings.forEach(f => {
      if (f.status !== 'confirmed' || !f.replyDue || daysDiff(f.replyDue) >= 0) return;
      out.push({ kind: 'find', id: f.id, lv: 'danger',
        title: `生产回复已超期 ${-daysDiff(f.replyDue)} 天`,
        desc: `${wsOf(f.workshopId).name} · ${f.title} · 需跟进催办`,
        page: 'fdetail', sub: { findId: f.id } });
    });
  }
  return out;
}

}

/* ============================================================
   业务动作
   ============================================================ */
function ensureDraft() {
  if (!S.sheet.draft) S.sheet.draft = {};
  return S.sheet.draft;
}

function saveFinding() {
  const s = S.sheet, d = s.draft;
  if (!String(d.title || '').trim()) { toast('请填写问题标题'); return; }
  if (!String(d.desc || '').trim()) { toast('请填写问题描述'); return; }

  const t = taskOf(s.taskId);
  if (s.type === 'editFind') {
    const f = findOf(s.findId);
    if (!can('fixFinding', f)) { toast('该发现项当前状态不可修改（仅限待确认 / 被退回）'); return; }
    f.title = d.title.trim();
    f.desc = d.desc.trim();
    f.level = d.level;
    f.cats = (d.cats || []).slice();
    f.photos = d.photos.slice();
    f.status = 'pending';
    f.foundAt = `${todayStr()} ${timeStr(new Date())}`;
    f.returnNote = '';
    f.editedBy = me().name;
    toast(`已由 ${me().name} 修改并重新提交，等待合规确认`);
  } else {
    if (!can('inspect', t)) { toast('当前角色无权在该车间登记发现项'); return; }
    const id = 'F-' + Date.now().toString(36).toUpperCase().slice(-6);
    D().findings.unshift({
      id, taskId: t.id, workshopId: t.workshopId, roomId: s.roomId,
      title: d.title.trim(), desc: d.desc.trim(), level: d.level, cats: (d.cats || []).slice(), photos: d.photos.slice(),
      status: 'pending', foundBy: t.assignee, foundAt: `${todayStr()} ${timeStr(new Date())}`,
      confirmBy: null, confirmAt: null, returnNote: '', reply: null, replyDue: null
    });
    t.rooms = t.rooms || {};
    t.rooms[s.roomId] = { checked: true, noIssue: false, at: `${todayStr()} ${timeStr(new Date())}` };
    if (taskStatus(t) === 'pending') t.status = 'doing';
    toast('发现项已登记，待合规确认');
  }
  if (D().drafts.find && D().drafts.find.taskId === s.taskId && D().drafts.find.roomId === s.roomId) D().drafts.find = null;
  persist();
  closeSheet();
  render();
}

function markRoomOk(taskId, roomId) {
  const t = taskOf(taskId);
  if (!can('inspect', t)) { toast('当前角色无权修改该任务'); return; }
  t.rooms = t.rooms || {};
  t.rooms[roomId] = { checked: true, noIssue: true, at: `${todayStr()} ${timeStr(new Date())}` };
  if (taskStatus(t) === 'pending') t.status = 'doing';
  persist(); render();
  toast('已标记本房间无异常');
}

function submitTask(taskId) {
  const t = taskOf(taskId);
  if (!can('inspect', t)) { toast('当前角色无权提交该任务'); return; }
  const w = wsOf(t.workshopId);
  const unchecked = w.rooms.filter(r => !(t.rooms || {})[r.id] || !(t.rooms[r.id].checked));
  if (unchecked.length) { toast(`还有 ${unchecked.length} 个房间未检查`); return; }
  const fs = findingsOfTask(t.id);
  t.status = fs.length ? 'submitted' : 'closed';
  t.visitAt = `${todayStr()} ${timeStr(new Date())}`;
  persist(); render();
  toast(fs.length ? `已提交，${fs.length} 项发现项待合规确认` : '巡检完成，未发现问题');
}

/* 按房间主数据自动指派整改回复人，可多选（合规确认时调用） */
function autoAssignOwner(f) {
  const r = roomOf(f.workshopId, f.roomId);
  const list = r ? ((Array.isArray(r.replyOwners) && r.replyOwners.length ? r.replyOwners : (r.replyOwner ? [r.replyOwner] : []))) : [];
  if (list.length) {
    f.autoOwners = list.slice();
    f.autoOwner = list.join('、');
  }
  return f.autoOwner || '';
}

function doConfirm(findId, level, note) {
  const f = findOf(findId);
  if (!can('confirmFind', f)) {
    toast(f.foundBy === me().name ? '不能确认本人登记的发现项（职责分离）' : '当前角色无权确认');
    return;
  }
  f.status = 'confirmed';
  f.level = level || f.level;
  f.confirmBy = me().name;
  f.confirmAt = `${todayStr()} ${timeStr(new Date())}`;
  if (note) f.returnNote = '';
  f.replyDue = addDays(D().settings.replyDays);
  const ro = autoAssignOwner(f);
  persist(); closeSheet(); render();
  toast(ro ? `已确认并自动分配给 ${ro}（${D().settings.replyDays} 天内回复）`
    : `已确认，推送整改回复人（${D().settings.replyDays} 天内回复）`);
}

function doReturn(findId, note) {
  const f = findOf(findId);
  if (!can('confirmFind', f)) { toast('当前角色无权退回该发现项'); return; }
  f.status = 'returned';
  f.returnNote = note;
  f.confirmBy = me().name;
  f.confirmAt = `${todayStr()} ${timeStr(new Date())}`;
  persist(); closeSheet(); render();
  toast('已退回巡检人补充');
}

function doReply(findId, owner, planDate, measures, photos, cats) {
  const f = findOf(findId);
  if (!can('replyFind', f)) {
    toast(inMyShops(f) ? '当前角色无权回复该发现项' : '该发现项不在你分管车间范围');
    return;
  }
  if (!String(measures || '').trim()) { toast('请填写整改措施'); return; }
  if ((cats || []).length) f.cats = cats.slice();
  if (D().drafts.reply && D().drafts.reply[findId]) delete D().drafts.reply[findId];
  f.reply = { owner, planDate, measures: measures.trim(), photos: (photos || []).slice(), at: `${todayStr()} ${timeStr(new Date())}` };
  f.status = 'replied';
  persist(); closeSheet(); render();
  toast('整改回复已提交');
}

function genMonthTasks() {
  const m = month();
  let created = 0;
  D().workshops.forEach(w => {
    const has = D().tasks.filter(t => t.month === m && t.workshopId === w.id).length;
    const need = Math.max(0, D().settings.freq - has);
    for (let i = 0; i < need; i++) {
      D().tasks.push({
        id: `T-${m.replace('-', '')}-${w.code}${i ? '-' + (i + 1) : ''}`,
        month: m, workshopId: w.id, assignee: INSPECTORS[(D().tasks.length + i) % INSPECTORS.length],
        due: `${m}-${new Date(m.slice(0, 4), +m.slice(5, 7), 0).getDate()}`,
        visitAt: '', createdAt: `${todayStr()} ${timeStr(new Date())}`, createdBy: me().name,
        status: 'pending', rooms: {}, note: ''
      });
      created++;
    }
  });
  persist(); render();
  toast(created ? `已补齐 ${created} 个巡检任务` : '本月任务已满足频率要求');
}

document.addEventListener('click', e => {
  // 点击产线下拉面板以外区域时收起
  if (S.lineOpen && !e.target.closest('[data-act="lineDrop"]') && !e.target.closest('[data-act="linePick"]')
    && !e.target.closest('[data-act="lineClear"]')) {
    S.lineOpen = false;
    if (S.page === 'stats') { render(); }
  }
  if (S.catOpen && !e.target.closest('[data-act="catDrop"]') && !e.target.closest('[data-act="catPick"]')
    && !e.target.closest('[data-act="catClear"]')) {
    S.catOpen = false;
    if (S.sheet) { renderSheet(); }
  }
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act;
  const d = S.sheet ? S.sheet.draft : null;
  handleAction(act, t, d);
});
function handleAction(act, t, d) {
  switch (act) {
    case 'tab': S.page = t.dataset.p; S.sub = {}; S.filter = 'all'; render(); break;
    case 'back': {
      const b = (PAGES[S.page] || {}).back || 'tasks';
      if (S.page === 'room') { S.page = 'wdetail'; render(); }
      else if (S.page === 'fdetail') { S.page = S.sub.from || b; render(); }
      else { S.page = b; render(); }
      break;
    }
    case 'wdetail': S.sub.taskId = t.dataset.id; S.page = 'wdetail'; render(); break;
    case 'room': S.sub.roomId = t.dataset.id; S.page = 'room'; render(); break;
    case 'roomView': S.sub.roomId = t.dataset.id; S.page = 'room'; render(); break;
    case 'fdetail': S.sub.findId = t.dataset.id; S.sub.from = S.page; S.page = 'fdetail'; render(); break;
    case 'filter': S.filter = t.dataset.k; render(); break;

    case 'loginSubmit': loginSubmit(); break;
    case 'roleSheet':
      openSheet({ type: 'role' }); break;
    case 'pickRole':
      if (CLOUD.user) { toast('云端登录账号的权限由「账号权限绑定」决定，不可手动切换'); break; }
      S.role = t.dataset.k;
      S.page = S.role === 'compliance' ? 'confirm' : S.role === 'production' ? 'replies' : 'tasks';
      S.sub = {}; closeSheet(); render();
      toast('已切换为' + ROLES[S.role].name);
      break;

    case 'newFind': {
      const t2 = taskOf(S.sub.taskId);
      openSheet({
        type: 'newFind', taskId: t2.id, roomId: t.dataset.room,
        draft: (D().drafts.find && D().drafts.find.taskId === t2.id && D().drafts.find.roomId === t.dataset.room)
          ? JSON.parse(JSON.stringify(D().drafts.find.draft))
          : { title: '', desc: '', level: 'major', cats: [], photos: [] }
      });
      break;
    }
    case 'editFind': {
      const f = findOf(t.dataset.id);
      openSheet({
        type: 'editFind', taskId: f.taskId, roomId: f.roomId, findId: f.id,
        draft: { title: f.title, desc: f.desc, level: f.level, cats: (f.cats || []).slice(), photos: (f.photos || []).slice() }
      });
      break;
    }
    case 'pickLevel':
      if (d) { d.level = t.dataset.lv; }
      document.querySelectorAll('.lv-pick button').forEach(b => b.classList.toggle('on', b.dataset.lv === d.level));
      break;
    case 'pickConfirmLevel':
      if (d) { d.level = t.dataset.lv; }
      document.querySelectorAll('.lv-pick button').forEach(b => b.classList.toggle('on', b.dataset.lv === d.level));
      break;
    case 'delPhoto':
      if (d) { d.photos.splice(+t.dataset.i, 1); renderSheet(); }
      break;
    case 'saveFind': saveFinding(); break;
    case 'markOk': markRoomOk(S.sub.taskId, t.dataset.room); break;
    case 'submitTask': submitTask(t.dataset.id); break;

    case 'openConfirm': {
      const f = findOf(t.dataset.id);
      openSheet({ type: 'confirm', findId: f.id, draft: { level: f.level, note: '' } });
      break;
    }
    case 'quickConfirm': {
      const f = findOf(t.dataset.id);
      doConfirm(f.id, f.level, '');
      break;
    }
    case 'doConfirm': {
      const s = S.sheet;
      doConfirm(s.findId, s.draft.level, s.draft.note);
      break;
    }
    case 'openReturn': {
      openSheet({ type: 'return', findId: t.dataset.id, draft: { note: '' } });
      break;
    }
    case 'switchReturn': {
      const s0 = S.sheet;
      openSheet({ type: 'return', findId: s0.findId, draft: { note: s0.draft && s0.draft.note || '' } });
      break;
    }

    case 'batchConfirm': {
      if (!can('confirmFind')) { toast('当前角色无权批量确认'); break; }

        return f && can('confirmFind', f);
      });
      if (!ids.length) { toast('请先勾选要确认的发现项'); break; }
      const at = `${todayStr()} ${timeStr(new Date())}`;
      const due = addDays(D().settings.replyDays);
      ids.forEach(id => {

    case 'export': if (can('exportAll')) exportExcel(); else toast('仅合规管理可导出全量数据'); break;
    case 'dataMgr':

    case 'dataProtect': openDataProtect(); break;

          snapListCloud().then(list => { S.sheet.snaps = list; renderSheet(); }).catch(() => {});
        }

    }
    case 'snapRestoreAsk': {
      if (!can('exportAll')) { toast('仅合规管理可恢复历史版本'); break; }
      const src = t.dataset.src;
      const at = t.dataset.at || '';
      if (src === 'local') {
        const h = histList()[Number(t.dataset.idx)] || {};
        openSheet({ type: 'snapConfirm', restoreSrc: 'local', restoreIdx: Number(t.dataset.idx), restoreAt: h.at || at, restoreStats: h.stats || dataStats(h.data || {}) });
      } else {
        const sn = ((S.sheet && S.sheet.snaps) || []).find(x => x.id === t.dataset.id) || {};
        openSheet({ type: 'snapConfirm', restoreSrc: 'cloud', restoreId: t.dataset.id, restoreAt: fmtAt(sn.at || at), restoreStats: sn.stats || {} });
      }
      break;
    }
    case 'snapRestoreDo': snapRestoreDo(); break;
    case 'backupExport':
      if (!can('exportAll')) { toast('仅合规管理可导出备份'); break; }
      backupExport();
      break;
    case 'backupImport':
      if (!can('exportAll')) { toast('仅合规管理可导入备份'); break; }
      openSheet({ type: 'backupImport' });
      break;
    case 'importDo': importDo(); break;
    case 'dropConfirm':
      CLOUD.dropPending = null; CLOUD.dropAck = true;
      closeSheet(); cloudPush();
      break;
    case 'dropCancel':
      CLOUD.dropPending = null; CLOUD.dropAck = false;
      closeSheet(); toast('已取消提交，请检查数据或刷新页面');
      break;
    case 'rangePick': {
      const d = rangeDraft();
      d.range = t.dataset.k;
      if (d.range === 'custom' && (!d.from || !d.to)) {
        // 自定义默认给最近 30 天，减少手输
        const end = todayStr(), s0 = new Date(); s0.setDate(s0.getDate() - 29);
        d.to = d.to || end;
        d.from = d.from || `${s0.getFullYear()}-${pad(s0.getMonth() + 1)}-${pad(s0.getDate())}`;
      }
      renderSheet(); break;
    }
    case 'exportRange': {
      if (!can('exportAll')) { toast('仅合规管理可导出数据'); break; }
      const d = rangeDraft();
      const b = rangeBounds(d.range, d);
      if (!b) { toast('请选择完整的起止日期'); break; }
      if (!deleteImpact(b).findings.length && !deleteImpact(b).tasks.length) { toast('该区间内没有数据可导出'); break; }
      exportExcel(b, rangeLabel(b));
      break;
    }
    case 'delRange': {
      if (!can('exportAll')) { toast('仅合规管理可删除数据'); break; }
      const d = rangeDraft();
      const b = rangeBounds(d.range, d);
      if (!b) { toast('请选择完整的起止日期'); break; }
      if (!deleteImpact(b).findings.length && !deleteImpact(b).tasks.length) { toast('该区间内没有可删除的数据'); break; }
      S.sheet = { type: 'delConfirm', draft: Object.assign({}, d) };
      renderSheet();
      break;
    }
    case 'delBack': S.sheet = { type: 'dataMgr', draft: Object.assign({}, rangeDraft()) }; renderSheet(); break;
    case 'delConfirm':
      if (!can('exportAll')) { toast('仅合规管理可删除数据'); break; }
      doDeleteRange();
      break;
  }
}

document.addEventListener('input', e => {

document.addEventListener('change', e => {
  const f = e.target.closest('[data-f]');
  if (f && S.sheet && S.sheet.draft) { S.sheet.draft[f.dataset.f] = f.value; return; }
  const imp = e.target.closest('[data-import]');
  if (imp && imp.files && imp.files[0]) { backupImportPick(imp.files[0]); imp.value = ''; return; }
  const file = e.target.closest('[data-photo]');
  if (file && file.files && file.files.length) {
    const s = S.sheet;
    const room = Math.max(0, 3 - ((s && s.draft && s.draft.photos) || []).length);
    const files = Array.prototype.slice.call(file.files, 0, room);
    let pending = files.length;
    files.forEach(fl => compress(fl, url => {
      if (s && s.draft && url) s.draft.photos.push(url);
      if (--pending === 0) renderSheet();
    }));
    file.value = '';
  }
});

function compress(file, cb) {
  const fr = new FileReader();
  fr.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const max = 300;
      const r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * r);
      c.height = Math.round(img.height * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      cb(c.toDataURL('image/jpeg', 0.62));
    };
    img.onerror = () => cb('');
    img.src = ev.target.result;
  };
  fr.onerror = () => cb('');
  fr.readAsDataURL(file);
}

function xlsCell(v, style) {
  const t = typeof v === 'number' && isFinite(v) ? 'Number' : 'String';
  const s = String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  return `<Cell${style ? ` ss:StyleID="${style}"` : ''}><Data ss:Type="${t}">${s}</Data></Cell>`;
}
function xlsRow(cells, style) {
  return `<Row>${cells.map(c => xlsCell(c, style)).join('')}</Row>`;
}

/* ============================================================
   数据管理：按日期范围统计 / 删除 / 导出
   ============================================================ */
const RANGES = [
  { k: 'month', n: '本月' },
  { k: 'lastMonth', n: '上月' },
  { k: 'quarter', n: '本季度' },
  { k: 'year', n: '本年度' },
  { k: 'all', n: '全部' },
  { k: 'custom', n: '自定义' }
];
const RANGE_NAME = k => (RANGES.find(r => r.k === k) || {}).n || k;
function mAdd(ym, delta) {
  const y = +ym.slice(0, 4), m0 = +ym.slice(5, 7) - 1 + delta;
  return `${y + Math.floor(m0 / 12)}-${pad(((m0 % 12) + 12) % 12 + 1)}`;
}

/* 按维度取日期：发现项按发现时间，任务按任务月份 */
function dateOfItem(kind, x) { return kind === 'find' ? (x.foundAt || '').slice(0, 10) : (x.month || ''); }

/* 计算区间范围（闭区间） */
function rangeBounds(range, draft) {
  const today = todayStr();
  const cur = today.slice(0, 7);
  const d = draft || {};
  const custom = (from, to) => (from && to && from <= to ? { from, to } : null);
  switch (range) {
    case 'month': return { from: cur, to: cur };
    case 'lastMonth': { const lm = mAdd(cur, -1); return { from: lm, to: lm }; }
    case 'quarter': {
      const y = today.slice(0, 4), q = Math.floor((+today.slice(5, 7) - 1) / 3);
      return { from: `${y}-${pad(q * 3 + 1)}`, to: `${y}-${pad(q * 3 + 3)}` };
    }
    case 'year': return { from: today.slice(0, 4), to: today.slice(0, 4) };
    case 'all': return { from: '', to: '' };
    case 'custom': return custom(d.from, d.to);
    default: return null;
  }
}
/* 区间比较：范围可为 YYYY-MM（任务）或 YYYY-MM-DD（发现项），统一截断到较短长度比较 */
function inBounds(x, b) {
  if (!b) return false;
  if (!b.from && !b.to) return true;
  const n = Math.min(b.from ? b.from.length : b.to.length, b.to ? b.to.length : b.from.length);
  const v = (x || '').slice(0, n || 10);
  if (!v) return false;
  return (!b.from || v >= b.from) && (!b.to || v <= b.to);
}
/* 区间内数据 */
function rangeData(b) {
  const fs = D().findings.filter(f => inBounds(dateOfItem('find', f), b));
  const ts = D().tasks.filter(t => inBounds(dateOfItem('task', t), b));
  const ids = {}; ts.forEach(t => { ids[t.id] = 1; });
  // 发现项所属任务若在区间内，也纳入任务统计（口径一致）
  return { findings: fs, tasks: ts, taskIds: ids };
}
function rangeLabel(b) {
  if (!b) return '无效区间';
  if (!b.from && !b.to) return '全部数据';
  return `${b.from || '最早'} ~ ${b.to || '至今'}`;
}
/* 删除影响面：区间内发现项 + 区间内任务 + 因删除发现项而失去全部发现项、且不属于其它保留任务的数据 */
function deleteImpact(b) {
  const { findings: fs, tasks: ts } = rangeData(b);
  return { findings: fs, tasks: ts };
}
function rangeDraft() {
  // 打开弹层时由 openSheet 注入 draft；未注入时用全局暂存，保证区间选择不丢
  if (S.sheet && (S.sheet.type === 'dataMgr' || S.sheet.type === 'delConfirm') && S.sheet.draft) return S.sheet.draft;
  if (!S.del) S.del = { range: 'month', from: '', to: '' };
  return S.del;
}

function doDeleteRange() {
  const d = rangeDraft();
  const b = rangeBounds(d.range, d);
  if (!b) { toast('请选择完整的起止日期（开始日期不能晚于结束日期）'); return; }
  const imp = deleteImpact(b);
  if (!imp.findings.length && !imp.tasks.length) { toast('该区间内没有可删除的数据'); return; }
  const fIds = {}; imp.findings.forEach(f => { fIds[f.id] = 1; });
  const tIds = {}; imp.tasks.forEach(t => { tIds[t.id] = 1; });
  const before = { f: D().findings.length, t: D().tasks.length };

  D().findings = D().findings.filter(f => !fIds[f.id]);
  D().tasks = D().tasks.filter(t => !tIds[t.id]);
  // 清理指向已删任务的残留发现项（理论上不会出现，防御性处理）
  D().findings = D().findings.filter(f => taskOf(f.taskId) || !tIds[f.taskId]);

  (D().deleteLog = D().deleteLog || []).unshift({
    at: `${todayStr()} ${timeStr(new Date())}`,
    by: me().name, range: rangeLabel(b), bounds: { from: b.from, to: b.to },
    findings: before.f - D().findings.length, tasks: before.t - D().tasks.length
  });
  S.picked = []; S.del = { range: d.range, from: d.from, to: d.to };
  CLOUD.dropAck = true;   // 已二次确认的批量删除，不再触发骤减提示
  persist(); closeSheet(); render();
  toast(`已删除 ${before.f - D().findings.length} 条发现项 / ${before.t - D().tasks.length} 个任务，操作已记入删除日志`);
}

/* 备份导出 / 导入 / 恢复执行 */
function backupExport() {
  const payload = { app: 'cleanroom-inspection', schema: 2, exportedAt: new Date().toISOString(), rev: CLOUD.rev, data: D() };
  const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
  const a = document.createElement('a');
  const d = new Date(), p = n => String(n).padStart(2, '0');
  a.href = URL.createObjectURL(blob);
  a.download = `巡检数据备份-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.json`;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
  toast('已导出备份文件');
}
function backupImportPick(file) {
  if (!file) return;
  const fr = new FileReader();
  fr.onload = ev => {
    try {
      const raw = JSON.parse(String(ev.target.result || ''));
      const d = raw && raw.data && Array.isArray(raw.data.workshops) ? raw.data : raw;
      if (!d || !Array.isArray(d.workshops) || !d.workshops.length) throw new Error('文件里没有车间数据');
      openSheet({ type: 'importConfirm', importData: d });
    } catch (e) {
      toast('导入失败：' + (e.message || '文件无法解析'));
    }
  };
  fr.readAsText(file);
}
function importDo() {
  const s = S.sheet || {};
  const data = s.importData;
  if (!data) return;
  snapWrite(CLOUD.rev, D(), '导入备份前自动备份');
  CLOUD.dropAck = true;
  applyCloudData(data);
  (D().roleLog = D().roleLog || []).unshift({ at: stampNow(), by: (me() || {}).name || '', act: '导入备份', note: '从备份文件还原整套数据' });
  closeSheet(); render();
  if (CLOUD.on) cloudPush();
  toast('已导入备份数据');
}
function snapRestoreDo() {
  const s = S.sheet || {};
  const finish = data => {
    if (!data || !Array.isArray(data.workshops)) { toast('该版本内容不完整，无法恢复'); return; }
    snapWrite(CLOUD.rev, D(), '恢复历史版本前自动备份');
    CLOUD.dropAck = true;
    applyCloudData(data);
    (D().roleLog = D().roleLog || []).unshift({ at: stampNow(), by: (me() || {}).name || '', act: '恢复历史版本', note: `回滚到 ${s.restoreAt || ''}` });
    closeSheet(); render();
    if (CLOUD.on) cloudPush();
    toast(`已恢复到 ${s.restoreAt || '所选版本'}`);
  };
  if (s.restoreSrc === 'local') {
    const h = histList()[s.restoreIdx];
    finish(h && h.data);
    return;
  }
  snapGet(s.restoreId).then(doc => finish(doc && doc.data)).catch(() => toast('读取快照失败，请检查网络'));
}
function openDataProtect() {
  if (!can('exportAll')) { toast('仅合规管理可访问数据保护'); return; }
  openSheet({ type: 'dataProtect', snaps: null });
  snapListCloud().then(list => {
    if (S.sheet && S.sheet.type === 'dataProtect') { S.sheet.snaps = list; renderSheet(); }
  }).catch(() => {
    if (S.sheet && S.sheet.type === 'dataProtect') { S.sheet.snaps = []; renderSheet(); }
  });
}

function exportExcel(bounds, label) {
  const B = bounds || { from: '', to: '' };
  const data = rangeData(B);
  // Sheet1：发现项明细
  const head1 = ['发现项编号', '车间', '房间编号', '房间名称', '问题标题', '问题描述', '级别', '发现项分类',
    '状态', '发现人', '发现时间', '确认人', '确认时间', '回复期限', '自动分配回复人', '整改责任人', '计划完成', '整改措施', '回复时间'];
  const rows1 = [xlsRow(head1, 'h')];
  data.findings.forEach(f => {
    const w = wsOf(f.workshopId) || { name: '' };
    const r = roomOf(f.workshopId, f.roomId) || { code: '', name: '' };
    rows1.push(xlsRow([
      f.id, w.name, r.code, r.name, f.title, f.desc, (LEVELS[f.level] || {}).name || f.level,
      (f.cats || []).join('、'),
      (FIND_ST[f.status] || {}).name || f.status, f.foundBy, f.foundAt, f.confirmBy || '', f.confirmAt || '',
      f.replyDue || '', f.autoOwner || '', f.reply ? f.reply.owner : '', f.reply ? f.reply.planDate : '',
      f.reply ? f.reply.measures : '', f.reply ? f.reply.at : ''
    ]));
  });
  // Sheet2：巡检任务汇总
  const head2 = ['任务编号', '车间', '巡检人', '创建人', '创建时间', '任务期限', '巡检时间', '状态', '发现项数'];
  const rows2 = [xlsRow(head2, 'h')];
  data.tasks.forEach(t => {
    const w = wsOf(t.workshopId) || { name: '' };
    rows2.push(xlsRow([
      t.id, w.name, t.assignee, t.createdBy || '', t.createdAt || '', t.due || '', t.visitAt || '',
      (TASK_ST[taskStatus(t)] || {}).name || '', findingsOfTask(t.id).length
    ]));
  });
  const xml = `<?xml version="1.0" encoding="UTF-8"?>
<?mso-application progid="Excel.Sheet"?>
<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet"
 xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">
 <Styles>
  <Style ss:ID="h"><Font ss:Bold="1" ss:Color="#FFFFFF"/>
   <Interior ss:Color="#0F8378" ss:Pattern="Solid"/><Alignment ss:Vertical="Center"/></Style>
 </Styles>
 <Worksheet ss:Name="发现项明细"><Table>${rows1.join('')}</Table></Worksheet>
 <Worksheet ss:Name="巡检任务汇总"><Table>${rows2.join('')}</Table></Worksheet>
</Workbook>`.replace(/\n/g, '\r\n');
  const tag = label === '全部数据' || !label ? '' : `_${String(label).replace(/[^\d\-~]/g, '').replace(/~/, '-')}`;
  try {
    const blob = new Blob(['\ufeff' + xml], { type: 'application/vnd.ms-excel;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `车间巡检数据${tag}_${todayStr()}.xls`;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
    toast(`已导出 ${data.findings.length} 条发现项 / ${data.tasks.length} 个任务`);
  } catch (err) {
    toast('当前预览环境不支持下载，请在浏览器中打开本文件');
  }
}

/* 启动：数据层立即引导；配置了 CloudBase 环境时，登录层作为遮罩盖在页面上，登录成功后揭开 */
(function start() {
  boot();
  if (!CLOUD_DB.env) return;
  // SDK 异步加载，稍等就绪后再判断登录态
  let tries = 0;
  const wait = () => {
    if (window.cloudbase) {
      try { authGuard(); } catch (e) { console.warn('登录门禁初始化失败：', e && e.message); }
      return;
    }
    if (++tries > 400) return; // 20 秒仍无 SDK（离线/CDN 不可达）→ 不出登录层，按本地模式使用
    setTimeout(wait, 50);
  };
  wait();
})();
